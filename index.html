<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poop Pocket</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd16a; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ===== Poop Pocket =====
// Click the park to SQUEEZE your animal and shoot poop.
// When it's empty, drag its food from the bowl to its mouth to feed it.
// Keys 1-4 (or tap the buttons) switch animals.

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---- The animals. Change these numbers to make them stronger or weaker! ----
const ANIMALS = [
  { name: 'Bird',     emoji: '🐦', food: '🌾', foodName: 'seeds',   maxAmmo: 6, perFood: 3, splat: 30, speed: 1.6 },
  { name: 'Dog',      emoji: '🐶', food: '🦴', foodName: 'bones',   maxAmmo: 4, perFood: 2, splat: 45, speed: 1.2 },
  { name: 'Cow',      emoji: '🐮', food: '🌿', foodName: 'grass',   maxAmmo: 3, perFood: 1, splat: 65, speed: 0.9 },
  { name: 'Elephant', emoji: '🐘', food: '🥜', foodName: 'peanuts', maxAmmo: 2, perFood: 1, splat: 95, speed: 0.7 },
];
ANIMALS.forEach(a => a.ammo = a.maxAmmo);

const PEOPLE = ['🚶', '🚶‍♀️', '🚶‍♂️', '🏃', '🏃‍♀️', '🧍', '🧍‍♀️', '🕺', '💃'];   // full-body people only
const YUCKS = ['EWW!', 'GROSS!', 'NOOO!', 'MY SHIRT!', 'YUCK!', 'WHY?!', 'EW EW EW'];
const ROUND_TIME = 60;

let current = 0;
let people = [], poops = [], splats = [], texts = [];
let score = 0, timeLeft = ROUND_TIME, state = 'title';
let squeeze = 0, chew = 0, hungryShake = 0;
let drag = null;            // the food you're carrying
let spawnTimer = 0;
let best = 0, muted = false;
try { best = +localStorage.getItem('poopBest') || 0; muted = localStorage.getItem('poopMute') === '1'; } catch (e) {}

// ---- Sounds (made with code, no sound files) ----
let audio = null, noiseBuf = null;
function sfx(kind, animal) {
  if (muted) return;
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    noiseBuf = audio.createBuffer(1, audio.sampleRate * 0.5, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (audio.state === 'suspended') audio.resume();
  const t = audio.currentTime;
  const tone = (type, f1, f2, dur, vol, delay = 0) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t + delay);
    o.frequency.exponentialRampToValueAtTime(f2, t + delay + dur);
    g.gain.setValueAtTime(vol, t + delay);
    g.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
    o.connect(g).connect(audio.destination);
    o.start(t + delay); o.stop(t + delay + dur + 0.02);
  };
  const noise = (dur, freq, vol) => {
    const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    s.buffer = noiseBuf; f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, t);
    f.frequency.exponentialRampToValueAtTime(100, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f).connect(g).connect(audio.destination);
    s.start(t); s.stop(t + dur);
  };
  if (kind === 'squeeze') {                                   // pfffft! bigger animal = deeper
    const low = 40 + 200 * (30 / animal.splat);
    noise(0.25, 1400, 0.5); tone('sawtooth', low * 1.6, low * 0.6, 0.22, 0.12);
  }
  if (kind === 'splat')  { noise(0.18, 2500, 0.6); tone('sine', 220, 70, 0.12, 0.3); }
  if (kind === 'eww')    tone('square', 560, 240, 0.4, 0.07);
  if (kind === 'nom')    { tone('sine', 300, 450, 0.08, 0.3); tone('sine', 300, 450, 0.08, 0.3, 0.15); }
  if (kind === 'empty')  tone('triangle', 300, 140, 0.3, 0.25);
  if (kind === 'switch') tone('sine', 600, 900, 0.08, 0.15);
  if (kind === 'end')    [523, 659, 784, 1046].forEach((f, i) => tone('square', f, f * 1.01, 0.16, 0.07, i * 0.16));
}
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('poopMute', muted ? '1' : '0'); } catch (e) {}
}
function selectAnimal(i) { if (i !== current) { current = i; sfx('switch'); } }
const muteBtn = () => ({ x: W - 44, y: 30 });

// ---- Layout helpers (the pocket shrinks to fit small screens like phones) ----
const ui = () => Math.max(0.6, Math.min(1, W / 900, H / 700));   // 1 = full size
const horizon = () => H * 0.28;
const animalPos = () => { const u = ui(); return { x: Math.max(85 * u + 10, Math.min(W * 0.2, 170)), y: H - 95 * u }; };
const bowlPos = () => { const u = ui(); return { x: W - Math.max(65 * u + 15, Math.min(W * 0.18, 150)), y: H - 80 * u }; };
const btnSize = () => Math.min(56 * Math.max(ui(), 0.8), W / 9);
const BTN_GAP = 8;
const gapLeft = () => animalPos().x + 85 * ui();       // right edge of the pocket hole
const gapRight = () => bowlPos().x - 65 * ui();        // left edge of the bowl
const buttonsFit = () => gapRight() - gapLeft() > ANIMALS.length * (btnSize() + BTN_GAP) + 20;
// If the buttons don't fit between the animal and the bowl, the pocket gets taller and they go on top.
const pocketTop = () => H - 200 * ui() - (buttonsFit() ? 0 : btnSize() + 16);
function buttonRects() {
  const s = btnSize(), total = ANIMALS.length * s + (ANIMALS.length - 1) * BTN_GAP;
  const cx = buttonsFit() ? (gapLeft() + gapRight()) / 2 : W / 2;
  const x0 = cx - total / 2, y = pocketTop() + 12;
  return ANIMALS.map((a, i) => ({ x: x0 + i * (s + BTN_GAP), y, w: s, h: s }));
}

// ---- People ----
function spawnPerson() {
  const depth = Math.random();                       // 0 = far away, 1 = close
  const y = horizon() + 30 + depth * (pocketTop() - horizon() - 70);
  const scale = (0.55 + depth * 0.8) * Math.max(ui(), 0.75);
  const dir = Math.random() < 0.5 ? 1 : -1;
  const emoji = PEOPLE[Math.floor(Math.random() * PEOPLE.length)];
  const runner = emoji.startsWith('🏃');
  people.push({
    x: dir === 1 ? -60 : W + 60, y, scale, dir, emoji,
    speed: (runner ? 140 : 60 + Math.random() * 50) * (0.6 + scale * 0.5),
    points: runner ? 3 : 1, hit: false, bob: Math.random() * 6,
  });
  people.sort((a, b) => a.y - b.y);                  // far people drawn first
}

// ---- Shooting (the squeeze!) ----
function shoot(tx, ty) {
  const a = ANIMALS[current];
  if (a.ammo <= 0) { hungryShake = 0.4; sfx('empty'); addText(animalPos().x, animalPos().y - 70, `Feed me ${a.foodName}!`, '#fff'); return; }
  a.ammo--;
  squeeze = 0.25;
  sfx('squeeze', a);
  const start = animalPos();
  const dist = Math.hypot(tx - start.x, ty - start.y);
  poops.push({ sx: start.x, sy: start.y - 30 * ui(), tx, ty, t: 0, dur: (0.35 + dist / 1400) / a.speed, size: a.splat, animal: current });
}

function land(p) {
  splats.push({ x: p.tx, y: p.ty, size: p.size, life: 4 });
  sfx('splat');
  let hits = 0;
  for (const person of people) {
    if (person.hit) continue;
    const size = 70 * person.scale;
    const bodyY = person.y - size * 0.45;
    if (Math.abs(person.x - p.tx) < size * 0.4 + p.size * 0.4 &&
        Math.abs(bodyY - p.ty) < size * 0.55 + p.size * 0.3) {
      person.hit = true;
      person.dir = person.x < W / 2 ? -1 : 1;        // run off the nearest side
      person.speed = 320;
      hits++;
      score += person.points;
      addText(person.x, person.y - size - 10, YUCKS[Math.floor(Math.random() * YUCKS.length)], '#fff');
      addText(person.x, person.y - size - 40, '+' + person.points, '#ffe14d');
    }
  }
  if (hits) sfx('eww');
  if (hits >= 2) { score += hits; addText(p.tx, p.ty - 80, `COMBO x${hits}!`, '#ff7ad9'); }
}

// ---- Feeding (the reload!) ----
function feed() {
  const a = ANIMALS[current];
  if (a.ammo >= a.maxAmmo) { addText(animalPos().x, animalPos().y - 70, "I'm full!", '#fff'); return; }
  a.ammo = Math.min(a.maxAmmo, a.ammo + a.perFood);
  chew = 0.6;
  sfx('nom');
  addText(animalPos().x, animalPos().y - 70, 'nom nom!', '#fff');
}

function addText(x, y, msg, color) { texts.push({ x, y, msg, color, life: 1.2 }); }

// ---- Input ----
function pointer(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
canvas.addEventListener('pointerdown', e => {
  const p = pointer(e);
  const m = muteBtn();
  if (Math.hypot(p.x - m.x, p.y - m.y) < 26) { toggleMute(); return; }
  if (state !== 'play') { startGame(); return; }
  const rects = buttonRects();
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    if (p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h) { selectAnimal(i); return; }
  }
  const b = bowlPos();
  if (Math.hypot(p.x - b.x, p.y - b.y) < Math.max(50, 70 * ui())) {
    drag = { x: p.x, y: p.y };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}  // keep the food even if you drag off the edge
    return;
  }
  if (p.y < pocketTop()) shoot(p.x, p.y);
});
canvas.addEventListener('pointermove', e => { if (drag) { const p = pointer(e); drag.x = p.x; drag.y = p.y; } });
canvas.addEventListener('pointerup', () => {
  if (!drag) return;
  const a = animalPos();
  if (Math.hypot(drag.x - a.x, drag.y - (a.y - 20)) < 80) feed();
  drag = null;
});
canvas.addEventListener('pointercancel', () => { drag = null; });
addEventListener('keydown', e => {
  const n = parseInt(e.key);
  if (n >= 1 && n <= ANIMALS.length) selectAnimal(n - 1);
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') startGame();
});

function startGame() {
  state = 'play'; score = 0; timeLeft = ROUND_TIME;
  people = []; poops = []; splats = []; texts = [];
  ANIMALS.forEach(a => a.ammo = a.maxAmmo);
  for (let i = 0; i < 3; i++) { spawnPerson(); people[people.length - 1].x = Math.random() * W; }
}

// ---- Update ----
function update(dt) {
  squeeze = Math.max(0, squeeze - dt);
  chew = Math.max(0, chew - dt);
  hungryShake = Math.max(0, hungryShake - dt);
  for (const t of texts) { t.life -= dt; t.y -= 40 * dt; }
  texts = texts.filter(t => t.life > 0);
  if (state !== 'play') return;

  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0; state = 'over'; drag = null; sfx('end');
    if (score > best) { best = score; try { localStorage.setItem('poopBest', best); } catch (e) {} }
  }

  spawnTimer -= dt;
  const busy = 1.6 - Math.min(1, (ROUND_TIME - timeLeft) / ROUND_TIME) * 0.8;  // more people later
  if (spawnTimer <= 0) { spawnPerson(); spawnTimer = busy * (0.6 + Math.random() * 0.8); }

  for (const p of people) { p.x += p.dir * p.speed * dt; p.bob += dt * (p.hit ? 18 : 8); }
  people = people.filter(p => p.x > -120 && p.x < W + 120);

  for (const p of poops) { p.t += dt; if (p.t >= p.dur) land(p); }
  poops = poops.filter(p => p.t < p.dur);
  for (const s of splats) s.life -= dt;
  splats = splats.filter(s => s.life > 0);
}

// ---- Drawing ----
function emoji(ch, x, y, size, flip) {
  ctx.save(); ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.font = `${size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch, 0, 0); ctx.restore();
}
function label(msg, x, y, size, color, stroke = true, align = 'center') {
  ctx.font = `bold ${size}px system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = 5; ctx.strokeStyle = '#3a2410'; ctx.strokeText(msg, x, y); }
  ctx.fillStyle = color; ctx.fillText(msg, x, y);
}
// Writes a sentence over several lines if it's too wide for the screen. Returns where it ended.
function para(msg, x, y, size, color, maxW) {
  ctx.font = `bold ${size}px system-ui, sans-serif`;
  const lines = [''];
  for (const word of msg.split(' ')) {
    const tryLine = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + word : word;
    if (ctx.measureText(tryLine).width > maxW && lines[lines.length - 1]) lines.push(word);
    else lines[lines.length - 1] = tryLine;
  }
  lines.forEach((l, i) => label(l, x, y + i * size * 1.3, size, color));
  return y + lines.length * size * 1.3;
}

function drawPark() {
  const sky = ctx.createLinearGradient(0, 0, 0, horizon());
  sky.addColorStop(0, '#6ec6ff'); sky.addColorStop(1, '#bfe8ff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, horizon());
  emoji('☀️', W * 0.8, 92, 50);
  emoji('☁️', W * 0.25, 50, 50); emoji('☁️', W * 0.6, 80, 40);
  ctx.fillStyle = '#7cc95a'; ctx.fillRect(0, horizon(), W, H);
  for (let i = 0; i < 7; i++) emoji('🌳', (i + 0.5) * W / 7, horizon() - 10, 55);
  ctx.fillStyle = '#d9c08a';                          // a path through the park
  ctx.fillRect(0, horizon() + (pocketTop() - horizon()) * 0.45, W, 26);
}

function drawPocket() {
  const top = pocketTop();
  ctx.fillStyle = '#3b5aa0'; ctx.fillRect(0, top, W, H - top);       // your jeans
  ctx.strokeStyle = '#f2c14e'; ctx.setLineDash([10, 8]); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, top + 6); ctx.lineTo(W, top + 6); ctx.stroke(); ctx.setLineDash([]);

  // The animal in your pocket
  const a = ANIMALS[current], pos = animalPos(), u = ui();
  ctx.fillStyle = '#2c4680';
  ctx.beginPath(); ctx.ellipse(pos.x, pos.y + 25 * u, 85 * u, 45 * u, 0, 0, Math.PI * 2); ctx.fill();   // pocket hole
  const sq = squeeze > 0 ? Math.sin(squeeze / 0.25 * Math.PI) : 0;
  const chomp = chew > 0 ? Math.abs(Math.sin(chew * 25)) * 0.12 : 0;
  const shake = hungryShake > 0 ? Math.sin(hungryShake * 60) * 6 : 0;
  ctx.save(); ctx.translate(pos.x + shake, pos.y);
  ctx.scale(1 + sq * 0.35 + chomp, 1 - sq * 0.3 - chomp);
  emoji(a.emoji, 0, -10 * u, 90 * u);
  ctx.restore();
  if (sq > 0) emoji('✊', pos.x + 55 * u, pos.y, 50 * u);             // your squeezing hand
  if (a.ammo === 0 && state === 'play') label('HUNGRY! Feed me →', Math.max(pos.x + 40, 110), top - 18, 20, '#ffe14d');

  // Food bowl
  const b = bowlPos();
  ctx.fillStyle = '#c0392b';
  ctx.beginPath(); ctx.ellipse(b.x, b.y + 20 * u, 65 * u, 25 * u, 0, 0, Math.PI * 2); ctx.fill();
  emoji(a.food, b.x - 20 * u, b.y, 40 * u); emoji(a.food, b.x + 18 * u, b.y + 4 * u, 40 * u);
  label(a.foodName, b.x, b.y - 42 * u, 16, '#fff');

  // Animal buttons
  buttonRects().forEach((r, i) => {
    ctx.fillStyle = i === current ? '#ffe14d' : 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill();
    emoji(ANIMALS[i].emoji, r.x + r.w / 2, r.y + r.h / 2, r.w * 0.62);
    label(String(i + 1), r.x + 9, r.y + 10, 12, '#fff', false);
  });
}

function drawPoopFlying(p) {
  const k = p.t / p.dur;
  const x = p.sx + (p.tx - p.sx) * k;
  const y = p.sy + (p.ty - p.sy) * k - Math.sin(k * Math.PI) * 120;
  const size = (p.size * 0.9) * (1 - k * 0.45);
  emoji('💩', x, y, size);
}

function draw() {
  drawPark();
  for (const s of splats) {
    ctx.globalAlpha = Math.min(1, s.life);
    ctx.fillStyle = '#6b3e13';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, s.size * 0.6, s.size * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    emoji('💩', s.x, s.y - s.size * 0.15, s.size * 0.6);
    ctx.globalAlpha = 1;
  }
  for (const p of people) {
    const size = 70 * p.scale;
    const bob = Math.abs(Math.sin(p.bob)) * 4 * p.scale;
    emoji(p.emoji, p.x, p.y - size * 0.45 - bob, size, p.dir === 1);   // emoji face left, so flip
    if (p.hit) emoji('💩', p.x, p.y - size * 0.95 - bob, size * 0.45);   // poop on their head!
  }
  for (const p of poops) drawPoopFlying(p);
  drawPocket();
  if (drag) emoji(ANIMALS[current].food, drag.x, drag.y, 48);
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life * 2); label(t.msg, t.x, t.y, 22, t.color); ctx.globalAlpha = 1; }

  label(`Score: ${score}`, 16, 30, 26, '#fff', true, 'left');
  label(`⏱ ${Math.ceil(timeLeft)}`, W >= 600 ? W / 2 : W - 115, 30, 26, timeLeft < 10 ? '#ff6b6b' : '#fff');
  const a = ANIMALS[current];                                          // poop left in your animal
  for (let i = 0; i < a.maxAmmo; i++) {
    ctx.globalAlpha = i < a.ammo ? 1 : 0.2;
    emoji('💩', 28 + i * 26, 64, 22);
  }
  ctx.globalAlpha = 1;

  if (state !== 'play') {
    ctx.fillStyle = 'rgba(40,20,5,0.7)'; ctx.fillRect(0, 0, W, H);
    const s = Math.min(54, W / 11);
    if (state === 'title') {
      const ts = Math.max(15, Math.min(20, W / 28)), maxW = Math.min(W - 32, 700);
      let y = H * 0.22;
      label('💩 POOP POCKET 💩', W / 2, y, s, '#ffe14d');
      y += s * 1.3;
      y = para('Click the park to SQUEEZE your animal and shoot poop at people.', W / 2, y, ts, '#fff', maxW) + ts * 0.5;
      y = para('Out of poop? Drag the food from the bowl into its mouth to feed it.', W / 2, y, ts, '#fff', maxW) + ts * 0.5;
      y = para('Switch animals with 1-4 or the buttons. Runners 🏃 are worth 3!', W / 2, y, ts, '#fff', maxW);
      label('Click to start', W / 2, y + Math.min(32, W / 16) * 1.5, Math.min(32, W / 16), '#ff7ad9');
    } else {
      const ts = Math.min(26, W / 18);
      let y = H * 0.28;
      label("TIME'S UP!", W / 2, y, s, '#ffe14d');
      y = para(`You pooped on people for ${score} points`, W / 2, y + s * 1.3, ts, '#fff', W - 32);
      label(`Best: ${best}`, W / 2, y + ts * 0.5, ts, '#fff');
      label('Click to play again', W / 2, y + ts * 3, Math.min(32, W / 16), '#ff7ad9');
    }
  }
  emoji(muted ? '🔇' : '🔊', muteBtn().x, muteBtn().y, 30);           // drawn last so it shows on every screen
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
