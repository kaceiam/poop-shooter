<body>
<canvas id="game"></canvas>
<script src="js/places.js"></script>
<script>
// ===== Poop Pocket =====
// Click the park to SQUEEZE your animal and shoot poop.
// When it's empty, drag its food from the bowl to its mouth to feed it.
// Keys 1-9, 0, - and = (or tap the buttons) switch animals.
//
// How this file is organized, top to bottom:
//   1. ANIMALS and levels                  - the things you can change to tweak the game
//      (the 13 places and their scenery live in js/places.js, which loads first)
//   2. Sounds, Party mode, the shop, hats  - made with code, no sound or picture files
//   3. Layout helpers                      - where the pocket, buttons and bowl go on any screen size
//   4. People, the boss, shooting, splats  - spawnPerson, spawnBoss, shoot, land, strike
//   5. Achievements, stats, challenges, combos, power-ups
//   6. Clicks and keys                     - the pointerdown and keydown handlers
//   7. Game modes                          - normal, Boss Rush, Zen and 2 Players
//   8. update()                            - moves everything forward a little each frame
//   9. Drawing                             - places, people, the pocket, menus, then draw()
//  10. The game loop at the very bottom

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---- The animals. Change these numbers to make them stronger or weaker! ----
const ANIMALS = [
  { name: 'Bird',     emoji: '🐦', food: '🌾', foodName: 'seeds',   maxAmmo: 6, perFood: 3, splat: 30, speed: 1.6 },
  { name: 'Dog',      emoji: '🐶', food: '🦴', foodName: 'bones',   maxAmmo: 4, perFood: 2, splat: 45, speed: 1.2 },
  { name: 'Cow',      emoji: '🐮', food: '🌿', foodName: 'grass',   maxAmmo: 3, perFood: 1, splat: 65, speed: 0.9 },
  { name: 'Elephant', emoji: '🐘', food: '🥜', foodName: 'peanuts', maxAmmo: 2, perFood: 1, splat: 95, speed: 0.7 },
  // Special animals: the monkey throws 3 at once, the unicorn's magic poop follows a person.
  { name: 'Monkey',   emoji: '🐒', food: '🍌', foodName: 'bananas', maxAmmo: 3, perFood: 1, splat: 28, speed: 1.4, spread: 3 },
  { name: 'Unicorn',  emoji: '🦄', food: '🍓', foodName: 'strawberries', maxAmmo: 2, perFood: 1, splat: 40, speed: 0.9, homing: true },
  // The skunk's poop leaves a stink cloud that splats anyone who walks into it.
  { name: 'Skunk',    emoji: '🦨', food: '🐛', foodName: 'bugs', maxAmmo: 2, perFood: 1, splat: 35, speed: 1.0, stink: true },
  // Shop animals (cost coins). The duck's poop bounces to a second spot, like skipping a stone.
  { name: 'Duck',     emoji: '🦆', food: '🍞', foodName: 'bread', maxAmmo: 3, perFood: 1, splat: 32, speed: 1.3, bounce: true,
    price: 60, shopText: 'Poop bounces to a 2nd spot' },
  { name: 'Bat',      emoji: '🦇', food: '🦟', foodName: 'mosquitoes', maxAmmo: 2, perFood: 1, splat: 30, speed: 1.0, line: 4,
    price: 100, shopText: 'Drops a line of 4 poops from the sky' },
  { name: 'Penguin',  emoji: '🐧', food: '🐟', foodName: 'fish', maxAmmo: 2, perFood: 1, splat: 40, speed: 1.0, freeze: true,
    price: 150, shopText: 'Ice poop freezes people nearby' },
  { name: 'Octopus',  emoji: '🐙', food: '🦐', foodName: 'shrimp', maxAmmo: 2, perFood: 1, splat: 34, speed: 1.0, split: 4,
    price: 200, shopText: 'Poop splits into 4 mini poops' },
  { name: 'Kangaroo', emoji: '🦘', food: '🍃', foodName: 'leaves', maxAmmo: 2, perFood: 1, splat: 34, speed: 1.1, boomerang: true,
    price: 250, shopText: 'Boomerang poop comes back and splats again' },
  { name: 'Dragon',   emoji: '🐉', food: '🌶️', foodName: 'peppers', maxAmmo: 2, perFood: 1, splat: 32, speed: 1.1, chain: 2,
    price: 300, shopText: 'Poop jumps to 2 more people nearby' },
  { name: 'Whale',    emoji: '🐳', food: '🦑', foodName: 'squid', maxAmmo: 2, perFood: 1, splat: 30, speed: 1.0, storm: true,
    price: 350, shopText: 'Makes a storm cloud that rains poop' },
];
ANIMALS.forEach(a => a.ammo = a.maxAmmo);
// What each animal does, for the help screen (shop animals use their shopText).
const ABOUT = {
  Bird: 'Small, fast poops', Dog: 'Medium splats', Cow: 'Big splats', Elephant: 'Huge, slow splats',
  Monkey: 'Throws 3 poops at once', Unicorn: 'Magic poop follows a person', Skunk: 'Stink cloud splats walkers',
};

const YUCKS = ['EWW!', 'GROSS!', 'NOOO!', 'MY SHIRT!', 'YUCK!', 'WHY?!', 'EW EW EW'];
const SKATER_YUCKS = ['WIPEOUT!', 'MY BOARD!', 'WHOA!'];
const UMBRELLA_YUCKS = ['NOT FAIR!', 'MY UMBRELLA!', 'TWO POOPS?!'];
// ---- Levels: reach the goal before time runs out to go to the next level ----
const LEVEL_TIME = 40;
let level = 1, levelScore = 0, bannerTime = 0;
// Level 1 = 8 points, then +4 each level up to level 5 (24). After that only +3, to stay kid-friendly.
const goal = () => level <= 5 ? 4 + level * 4 : 24 + (level - 5) * 3;
const lvl = () => mode === 'zen' ? 1 : level;          // zen mode stays easy no matter where you are
const speedBoost = () => 1 + 0.18 * (lvl() - 1);        // people get faster every level
const crowdBoost = () => 1 + 0.25 * (lvl() - 1);        // and there are more of them
const dodgeChance = () => Math.min(0.45, 0.1 + 0.08 * (lvl() - 1));   // more sneaky dodgers too
const isBossLevel = () => level % 3 === 0;              // a giant boss on levels 3, 6, 9...
let bossSpawned = false;
const NOPES = ['Nope!', 'Missed me!', 'Too slow!', 'Hah!', 'Not today!'];

let current = 0;
let people = [], poops = [], splats = [], texts = [];
let score = 0, timeLeft = LEVEL_TIME, state = 'title';   // states: title, play, banner, over
let squeeze = 0, chew = 0, hungryShake = 0;
let drag = null;            // the food you're carrying
let spawnTimer = 0;
let best = 0, bestLevel = 0, volume = 2, newBest = false;   // volume: 0 = off, 1 = quiet, 2 = loud
try {
  best = +localStorage.getItem('poopBest') || 0;
  bestLevel = +localStorage.getItem('poopBestLevel') || 0;
  const v = localStorage.getItem('poopVolume');
  volume = v !== null ? +v : localStorage.getItem('poopMute') === '1' ? 0 : 2;   // old saves that were muted stay muted
} catch (e) {}

// ---- Sounds (made with code, no sound files) ----
let audio = null, noiseBuf = null, master = null;
const VOLUME_LEVEL = [0, 0.35, 1];
function sfx(kind, animal) {
  if (!volume) return;
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    noiseBuf = audio.createBuffer(1, audio.sampleRate * 0.5, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    master = audio.createGain(); master.connect(audio.destination);   // one volume knob for all sounds
  }
  if (audio.state === 'suspended') audio.resume();
  master.gain.value = VOLUME_LEVEL[volume];
  const t = audio.currentTime;
  const tone = (type, f1, f2, dur, vol, delay = 0) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t + delay);
    o.frequency.exponentialRampToValueAtTime(f2, t + delay + dur);
    g.gain.setValueAtTime(vol, t + delay);
    g.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
    o.connect(g).connect(master);
    o.start(t + delay); o.stop(t + delay + dur + 0.02);
  };
  const noise = (dur, freq, vol) => {
    const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    s.buffer = noiseBuf; f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, t);
    f.frequency.exponentialRampToValueAtTime(100, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f).connect(g).connect(master);
    s.start(t); s.stop(t + dur);
  };
  if (kind === 'squeeze') {                                   // pfffft! bigger animal = deeper
    const low = 40 + 200 * (30 / animal.splat);
    noise(0.25, 1400, 0.5); tone('sawtooth', low * 1.6, low * 0.6, 0.22, 0.12);
  }
  if (kind === 'splat')  { noise(0.18, 2500, 0.6); tone('sine', 220, 70, 0.12, 0.3); }
  if (kind === 'eww')    tone('square', 560, 240, 0.4, 0.07);
  if (kind === 'nom')    { tone('sine', 300, 450, 0.08, 0.3); tone('sine', 300, 450, 0.08, 0.3, 0.15); }
  if (kind === 'empty')  tone('triangle', 300, 140, 0.3, 0.25);
  if (kind === 'combo')  { const f = 500 + Math.min(3, streak) * 150; tone('square', f, f * 1.5, 0.12, 0.06); }
  if (kind === 'power')  [660, 880, 1100, 1320, 1760].forEach((f, i) => tone('triangle', f, f, 0.1, 0.1, i * 0.05));
  if (kind === 'boss')   { tone('sawtooth', 110, 98, 0.5, 0.12); tone('sawtooth', 82, 73, 0.6, 0.12, 0.45); }
  if (kind === 'freeze') [1568, 2093, 2637].forEach((f, i) => tone('triangle', f, f * 0.97, 0.18, 0.07, i * 0.05));
  if (kind === 'magic')  [880, 1175, 1568].forEach((f, i) => tone('sine', f, f * 1.02, 0.15, 0.08, i * 0.06));
  if (kind === 'boing')  { tone('sine', 250, 700, 0.15, 0.25); tone('sine', 700, 350, 0.15, 0.15, 0.15); }
  if (kind === 'dodge')  { noise(0.15, 3000, 0.2); tone('sine', 500, 1200, 0.12, 0.08); }
  if (kind === 'switch') tone('sine', 600, 900, 0.08, 0.15);
  if (kind === 'level')  [523, 659, 784, 1046].forEach((f, i) => tone('square', f, f * 1.01, 0.16, 0.07, i * 0.16));
  if (kind === 'end')    [392, 330, 262, 196].forEach((f, i) => tone('triangle', f, f * 0.98, 0.25, 0.15, i * 0.22));
}
// The speaker button steps through loud -> quiet -> off -> loud.
function toggleMute() {
  volume = (volume + 2) % 3;
  try { localStorage.setItem('poopVolume', volume); } catch (e) {}
  sfx('switch');                                       // a little beep so you can hear the new volume
}
// ---- Animal shop: your points become coins after each game. Special animals cost coins. ----
let coins = 0, owned = new Set(), showShop = false, shopMsg = '', shopRows = [];
try {
  coins = +localStorage.getItem('poopCoins') || 0;
  owned = new Set(JSON.parse(localStorage.getItem('poopOwned') || '[]'));
} catch (e) {}
const isOwned = a => !a.price || owned.has(a.name);
// Hats for your pocket animal (looks only). Buy once, then wear any one of them.
const ANIMAL_HATS = [
  { id: 'cap',    emoji: '🧢', name: 'cap',      price: 15 },
  { id: 'bow',    emoji: '🎀', name: 'bow',      price: 15 },
  { id: 'top',    emoji: '🎩', name: 'top hat',  price: 25 },
  { id: 'sun',    emoji: '👒', name: 'sun hat',  price: 25 },
  { id: 'grad',   emoji: '🎓', name: 'grad cap', price: 35 },
  { id: 'helmet', emoji: '⛑️', name: 'helmet',   price: 35 },
  { id: 'flower', emoji: '🌸', name: 'flower',   price: 15 },
  { id: 'berry',  emoji: '🍓', name: 'strawberry', price: 20 },
  { id: 'star',   emoji: '⭐', name: 'star',     price: 40 },
  { id: 'rainbow', emoji: '🌈', name: 'rainbow', price: 50 },
  { id: 'fire',   emoji: '🔥', name: 'fire hat', price: 60 },
  { id: 'crown',  emoji: '👑', name: 'crown',    price: 100 },
];
let shopTab = 'animals', shopTabs = [], shopCells = [], hatsOwned = new Set(), hatOn = '';
try {
  hatsOwned = new Set(JSON.parse(localStorage.getItem('poopHats') || '[]'));
  hatOn = localStorage.getItem('poopHatOn') || '';
} catch (e) {}
function saveHats() {
  try { localStorage.setItem('poopHats', JSON.stringify([...hatsOwned])); localStorage.setItem('poopHatOn', hatOn); } catch (e) {}
}
function tapHat(h) {
  if (hatsOwned.has(h.id)) {                           // already yours: wear it, or take it off
    hatOn = hatOn === h.id ? '' : h.id;
    shopMsg = hatOn ? `Your animal is wearing the ${h.name}! ${h.emoji}` : 'Hat off!';
  } else if (coins < h.price) {
    shopMsg = `You need ${h.price - coins} more coins for the ${h.name}!`; sfx('empty'); return;
  } else {
    coins -= h.price; saveShop(); hatsOwned.add(h.id); hatOn = h.id;
    shopMsg = `You got the ${h.name}! ${h.emoji}`; sfx('power');
  }
  saveHats();
}
function saveShop() {
  try { localStorage.setItem('poopCoins', coins); localStorage.setItem('poopOwned', JSON.stringify([...owned])); } catch (e) {}
}
function buy(a) {
  if (isOwned(a)) return;
  if (coins < a.price) { shopMsg = `You need ${a.price - coins} more coins for the ${a.name}!`; sfx('empty'); return; }
  coins -= a.price; owned.add(a.name); saveShop();
  shopMsg = `You got the ${a.name}! ${a.emoji}`;
  sfx('power');
}

// ---- People react to the animal in your pocket ----
// scared: they run faster for a bit. curious: they stop to look (easy target!). gross: they slow down.
const REACTIONS = {
  Bird:     ['curious', ['Tweet tweet! 🐦', 'Is that a bird?']],
  Dog:      ['curious', ['Good doggy! 🐶', 'Aww, a puppy!']],
  Cow:      ['scared',  ['Moo-ve away! 🐮', 'A COW?!']],
  Elephant: ['scared',  ['RUN! 🐘', "It's HUGE!"]],
  Monkey:   ['curious', ['Ha ha, a monkey! 🐒', 'Ooh ooh ah ah!']],
  Unicorn:  ['curious', ['Ooh, a unicorn! 🦄', 'So pretty!']],
  Skunk:    ['gross',   ["What's that smell? 🤢", 'Pee-yew!']],
  Duck:     ['curious', ['Quack? 🦆', 'A duck!']],
  Bat:      ['scared',  ['A BAT! 🦇', 'Eek!']],
  Penguin:  ['curious', ['Aww, a penguin! 🐧', 'So cute!']],
  Octopus:  ['scared',  ['Tentacles?! 🐙', 'Run!']],
  Kangaroo: ['curious', ['Is that a kangaroo? 🦘', 'Boing?']],
  Dragon:   ['scared',  ['A DRAGON?! 🐉', 'Hot hot hot!']],
  Whale:    ['curious', ['A WHALE?! 🐳', 'Is it going to rain?']],
};
let reactTimer = 5;
function reactTo(a, count) {
  const r = REACTIONS[a.name];
  if (!r) return;
  const who = people.filter(p => !p.hit && !p.boss && !(p.frozen > 0) && p.x > 40 && p.x < W - 40)
    .sort(() => Math.random() - 0.5).slice(0, count);
  for (const p of who) {
    const size = 70 * p.scale;
    if (r[0] === 'scared') { p.moodMul = 1.7; p.moodTime = 2; }
    else if (r[0] === 'gross') { p.moodMul = 0.45; p.moodTime = 2.5; }
    else p.pause = Math.max(p.pause || 0, 1.3);
    addText(p.x, p.y - size - 18, r[1][Math.floor(Math.random() * r[1].length)], r[0] === 'scared' ? '#ffcc80' : r[0] === 'gross' ? '#c5e1a5' : '#fff');
  }
}

function selectAnimal(i) {
  if (!isOwned(ANIMALS[i])) { addText(W / 2, pocketTop() - 40, `🔒 Get the ${ANIMALS[i].name} in the shop!`, '#ffe14d'); sfx('empty'); return; }
  if (i !== current) { current = i; sfx('switch'); if (state === 'play') reactTo(ANIMALS[i], 2); }   // people notice your new animal
}
const muteBtn = () => ({ x: W - 44, y: 30 });

// ---- Party mode (looks only): silly hats on people and confetti on big moments ----
// A menu (shop, help, achievements, what's new) covers the screen: hide the party button so it can't get in the way.
const menuOpen = () => (state === 'title' || state === 'over') && (showShop || showTrophies || helpPage || showNews || showStats);
const partyBtn = () => W < 600 ? { x: W - 44, y: 118 } : { x: W - 90, y: 30 };   // under the pause button on phones
const HATS = ['🎩', '👒', '🧢', '🎓'];
const CONFETTI_COLORS = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb', '#ff9100'];
let party = false, confetti = [];
try { party = localStorage.getItem('poopParty') === '1'; } catch (e) {}
function toggleParty() {
  party = !party;
  try { localStorage.setItem('poopParty', party ? '1' : '0'); } catch (e) {}
  if (party) burst(W / 2, H * 0.3, 40);
}
function burst(x, y, count) {
  if (!party) return;
  for (let i = 0; i < count && confetti.length < 250; i++) {
    const a = Math.random() * Math.PI * 2, sp = 120 + Math.random() * 260;
    confetti.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, rot: Math.random() * 6, life: 1.6 + Math.random(),
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)] });
  }
}
function updateConfetti(dt) {
  for (const c of confetti) { c.vy += 500 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.99; c.rot += dt * 8; c.life -= dt; }
  confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
}
function drawConfetti() {
  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.globalAlpha = Math.min(1, c.life); ctx.fillStyle = c.color; ctx.fillRect(-4, -2, 8, 4);
    ctx.restore();
  }
}
const pauseBtn = () => ({ x: W - 44, y: 74 });
let paused = false;
const canPause = () => state === 'play' || state === 'banner';
function setPaused(v) { if (!canPause()) return; paused = v; drag = null; }
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });   // pause when you switch away

// ---- Layout helpers (the pocket shrinks to fit small screens like phones) ----
const ui = () => Math.max(0.6, Math.min(1, W / 900, H / 700));   // 1 = full size
const horizon = () => H * 0.28;
const upright = () => W < 600 && H >= W;                // a phone held upright: buttons go above the pocket
const shortSideways = () => H < 430 && W > H;           // a phone held sideways: animal and bowl hug the edges
const animalPos = () => { const u = ui(); return { x: shortSideways() ? 85 * u + 10 : Math.max(85 * u + 10, Math.min(W * 0.2, 170)), y: H - 95 * u }; };
const bowlPos = () => { const u = ui(); return { x: W - (shortSideways() ? 65 * u + 15 : Math.max(65 * u + 15, Math.min(W * 0.18, 150))), y: H - 80 * u }; };
// Animal buttons: on wide screens they sit between the animal and the food bowl (in two rows if one
// row won't fit there). On phones they go above, in two rows so they stay big enough to tap.
const BTN_GAP = 8;
const gapLeft = () => animalPos().x + 85 * ui();       // right edge of the pocket hole
const gapRight = () => bowlPos().x - 65 * ui();        // left edge of the bowl
const baseBtn = () => Math.min(56 * Math.max(ui(), 0.8), W / 9);
const gapBtn = count => (gapRight() - gapLeft() - 20) / count - BTN_GAP;   // button size if this many fit in the gap
const fitsInGap = count => gapBtn(count) >= Math.min(28, baseBtn());     // buttons may shrink a little to fit
const twoRows = () => upright() ? (W - 16) / ANIMALS.length - 8 < 40 : !fitsInGap(ANIMALS.length);
const perRow = () => twoRows() ? Math.ceil(ANIMALS.length / 2) : ANIMALS.length;
const inGapSize = () => Math.min(baseBtn(), gapBtn(perRow()));
const buttonsFit = () => !upright() && fitsInGap(perRow()) && 12 + (twoRows() ? 2 : 1) * (inGapSize() + BTN_GAP) <= 200 * ui();
const btnSize = () => buttonsFit() ? inGapSize() : Math.min(baseBtn(), twoRows() ? 52 : W / 9, (W - 16) / perRow() - 8);   // all buttons fit
// If the buttons don't fit between the animal and the bowl, the pocket gets taller and they go on top.
const pocketTop = () => H - 200 * ui() - (buttonsFit() ? 0 : (btnSize() + 16) + (twoRows() ? btnSize() + BTN_GAP : 0));
function buttonRects() {
  const s = btnSize(), n = perRow();
  const cx = buttonsFit() ? (gapLeft() + gapRight()) / 2 : W / 2;
  return ANIMALS.map((a, i) => {
    const row = Math.floor(i / n), col = i % n;
    const inRow = Math.min(n, ANIMALS.length - row * n);              // the last row may be shorter
    const total = inRow * s + (inRow - 1) * BTN_GAP;
    return { x: cx - total / 2 + col * (s + BTN_GAP), y: pocketTop() + 12 + row * (s + BTN_GAP), w: s, h: s };
  });
}

// ---- People ----
function spawnPerson() {
  const depth = Math.random();                       // 0 = far away, 1 = close
  const y = horizon() + 30 + depth * (pocketTop() - horizon() - 70);
  const scale = (0.55 + depth * 0.8) * Math.max(ui(), 0.75);
  const dir = Math.random() < 0.5 ? 1 : -1;
  const here = place();
  const emoji = here.people[Math.floor(Math.random() * here.people.length)];
  const prop = Math.random() < 0.6 ? here.props[Math.floor(Math.random() * here.props.length)] : null;
  const runner = emoji.startsWith('🏃');
  const dodger = !runner && Math.random() < dodgeChance();
  // Special people: umbrella people block one poop, skaters zoom by.
  const roll = Math.random();
  const umbrella = !runner && !dodger && roll < (place().rainy ? 0.25 : 0.1);   // lots of umbrellas in the rainy city
  const skater = !runner && !dodger && !umbrella && roll < (place().rainy ? 0.32 : 0.18);
  let speed = (runner ? 140 : 60 + Math.random() * 50) * (0.6 + scale * 0.5) * speedBoost();
  if (skater) speed *= 2.2;
  const snowRider = emoji === '⛷️' || emoji === '🏂';  // skiers and snowboarders whoosh by
  if (snowRider) speed *= 1.8;
  const golden = !umbrella && !skater && Math.random() < 1 / 50;   // rare golden people: worth 10!
  if (golden) speed *= 1.3;
  people.push({
    x: dir === 1 ? -60 : W + 60, y, scale, dir, emoji: skater ? '🧍' : emoji, prop: umbrella || skater || golden ? null : prop,
    speed, points: golden ? 10 : runner || skater ? 3 : dodger || umbrella || snowRider ? 2 : 1, hit: false, bob: Math.random() * 6,
    hat: HATS[Math.floor(Math.random() * HATS.length)], golden,

// ---- Shooting (the squeeze!) ----
function shoot(tx, ty) {
  const a = ANIMALS[current];
  if (a.ammo <= 0) { hungryShake = 0.4; sfx('empty'); addText(animalPos().x, animalPos().y - 70, `Feed me ${a.foodName}!`, '#fff'); return; }
  a.ammo--;
  round.shots[a.name] = (round.shots[a.name] || 0) + 1;   // for the recap
  life.shots[a.name] = (life.shots[a.name] || 0) + 1;
  squeeze = 0.25;
  lastShotX = tx;
  sfx('squeeze', a);
  const start = animalPos();
  const dist = Math.hypot(tx - start.x, ty - start.y);
  const floaty = !!place().lowGravity, sink = !!place().underwater;   // moon: big floaty arcs, reef: slow wobbly sinking
  const dur = (0.35 + dist / 1400) / a.speed * (floaty ? 1.4 : sink ? 1.6 : 1);
  const size = superTime > 0 ? Math.max(100, a.splat * 1.8) : a.splat * levelBoost(a);   // super poop = giant splats; higher animal levels splat a bit bigger
  const make = (x, y) => ({ sx: start.x, sy: start.y - 30 * ui(), tx: x, ty: y, t: 0, dur, size, animal: current, floaty, sink });
  if (a.line) {                                        // bat: a line of poops dropped from the sky, one after another
    for (let i = 0; i < a.line; i++) {
      const x = tx + (i - (a.line - 1) / 2) * 50;
      poops.push({ sx: x, sy: Math.max(30, horizon() * 0.45), tx: x, ty, t: -0.3 - i * 0.1, dur: 0.4, size, animal: current, drop: true, lead: i === 0 });
    }
  } else if (a.spread) {                               // monkey: a spread of poops
    const gap = 55;
    for (let i = 0; i < a.spread; i++) poops.push(make(tx + (i - (a.spread - 1) / 2) * gap, ty));
  } else {
    const poop = make(tx, ty);
    if (a.homing) {                                    // unicorn: lock on to the person nearest the click
      let bestD = 220;
      for (const p of people) {
        if (p.hit) continue;
        const d = Math.hypot(p.x - tx, (p.y - 35 * p.scale) - ty);
        if (d < bestD) { bestD = d; poop.follow = p; }
      }
      sfx('magic');
    }
    poops.push(poop);
  }
}

function land(p) {
  splats.push({ x: p.tx, y: p.ty, size: p.size, life: 4, magic: !!ANIMALS[p.animal].homing, ice: !!ANIMALS[p.animal].freeze });
  if (place().snowy) Object.assign(splats[splats.length - 1], { vx: 140, got: new Set() });   // on the mountain, poop rolls downhill
  if (ANIMALS[p.animal].freeze) freezeAround(p.tx, p.ty);   // penguin!
  if (ANIMALS[p.animal].stink) clouds.push({ x: p.tx, y: p.ty, r: 60, life: 3, got: new Set() });   // skunk!
  if (ANIMALS[p.animal].storm && !p.stormDrop) storms.push({ x: p.tx, y: p.ty, life: 3, next: 0, animal: p.animal });   // whale: a poop storm!
  if (ANIMALS[p.animal].boomerang && !p.back) {        // kangaroo: the poop swoops back toward you
    const tx = p.tx + (p.sx - p.tx) * 0.75, ty = Math.min(pocketTop() - 20, p.ty + (p.sy - p.ty) * 0.75);
    poops.push({ sx: p.tx, sy: p.ty, tx, ty, t: 0, dur: 0.7, size: p.size, animal: p.animal, back: true, got: new Set() });
  }
  if (ANIMALS[p.animal].split && !p.mini) {            // octopus: split into mini poops that splash outward
    const n = ANIMALS[p.animal].split;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + Math.PI / 4;
      const tx = Math.max(20, Math.min(W - 20, p.tx + Math.cos(ang) * 80));
      const ty = Math.max(horizon() + 20, Math.min(pocketTop() - 20, p.ty + Math.sin(ang) * 45));
      poops.push({ sx: p.tx, sy: p.ty, tx, ty, t: 0, dur: 0.3, size: Math.max(20, p.size * 0.6), animal: p.animal, mini: true });
    }
  }
  if (ANIMALS[p.animal].bounce && !p.bounced) {        // duck: hop forward to a second spot
    const tx = Math.max(20, Math.min(W - 20, p.tx + (p.tx - p.sx) * 0.4));
    const ty = Math.max(horizon() + 20, Math.min(pocketTop() - 20, p.ty + (p.ty - p.sy) * 0.4));
    poops.push({ sx: p.tx, sy: p.ty, tx, ty, t: 0, dur: 0.35, size: p.size, animal: p.animal, bounced: true });
  }
  sfx('splat');
  let hits = 0;
  for (const person of people) {
    if (person.hit) continue;
    const size = 70 * person.scale;
    const bodyY = person.y - size * 0.45;
    if (Math.abs(person.x - p.tx) < size * 0.4 + p.size * 0.4 &&
        Math.abs(bodyY - p.ty) < size * 0.55 + p.size * 0.3) {
      if (strike(person, !hits, p.tx, p.ty)) hits++;   // a poop that bounces off an umbrella doesn't count
    }
  }
  if (hits) sfx('eww');
  if (hits >= 2) { addPoints(hits); addText(p.tx, p.ty - 110, `${hits} AT ONCE!`, '#9ff'); }
  if (ANIMALS[p.animal].chain && hits && !p.chained) chainPoop(p);   // dragon: fiery poop jumps to people nearby
}

// Dragon: after a hit, fiery poops jump to the nearest people (they can't jump again).
function chainPoop(p) {
  const targets = people.filter(q => !q.hit && Math.hypot(q.x - p.tx, q.y - 35 * q.scale - p.ty) < 230)
    .sort((a, b) => Math.hypot(a.x - p.tx, a.y - p.ty) - Math.hypot(b.x - p.tx, b.y - p.ty))
    .slice(0, ANIMALS[p.animal].chain);
  for (const t of targets) {
    poops.push({ sx: p.tx, sy: p.ty, tx: t.x, ty: t.y - 35 * t.scale, t: 0, dur: 0.3, size: p.size, animal: p.animal, chained: true, follow: t });
  }
  if (targets.length) addText(p.tx, p.ty - 70, 'ZAP! 🔥', '#ffab40');
}

// On the mountain a splat rolls downhill for a moment and splats anyone it bumps into.
function rollSplat(s, dt) {
  s.x += s.vx * dt;
  s.vx *= Math.pow(0.25, dt);                          // slows down quickly
  if (s.x > W - 10) s.vx = 0;
  for (const person of people) {
    if (person.hit || s.got.has(person)) continue;
    const size = 70 * person.scale;
    if (Math.abs(person.x - s.x) < size * 0.35 + s.size * 0.3 && Math.abs(person.y - s.y) < size * 0.5) {
      s.got.add(person);
      if (strike(person, true, s.x, s.y)) sfx('eww');
    }
  }
}

// Penguin ice poop: everyone near the splat freezes for 3 seconds (easy to hit, and they can't dodge).
function freezeAround(x, y) {
  let froze = 0;
  for (const person of people) {
    if (person.hit) continue;
    if (Math.hypot(person.x - x, person.y - 35 * person.scale - y) < 130) { person.frozen = 3; person.dodgeTime = 0; froze++; }
  }
  if (froze) { addText(x, y - 60, 'BRRR! 🥶', '#9ff'); sfx('freeze'); }
}

// What happens when poop (or a stink cloud) gets someone.
function strike(person, countsForStreak, x, y, fromCloud) {
  const size = 70 * person.scale;
  if (person.umbrella && !fromCloud) {                 // the umbrella blocks one poop (but not a stink cloud)
    person.umbrella = false;
    addText(person.x, person.y - size - 10, 'BOING! ☂️', '#9ff');
    sfx('boing');
    return false;
  }
  if (countsForStreak) bumpStreak(x, y);
  if (tut === 1) tut = 2;
  if (person.boss && person.hp > 1) {                  // the boss needs 3 hits
    person.hp--; person.flash = 0.3;
    addText(person.x, person.y - size - 10, `OOF! ${person.hp} more!`, '#ff7ad9');
    return true;
  }
  if (person.boss) { person.hp = 0; addText(W / 2, horizon() + 40, `${person.bossName || 'BOSS'} DOWN! 🎉`, '#ffe14d'); unlock('boss'); burst(person.x, person.y - size, 60); dailyEvent('boss');
    if (mode === 'rush') { rushBeaten++; level++; }   // boss rush: the next boss is faster (and somewhere new)
    life.bosses++;
  }
  if (person.dodger) { countStat('dodgers', 5, 'dodger5'); dailyEvent('dodgers'); }
  if (person.skater) dailyEvent('skaters');
  if (person.hadUmbrella) dailyEvent('umbrellas');
  dailyEvent('splat');
  life.splats++;
  gainXP(ANIMALS[current]);                            // the animal you're using gets closer to its next level
  if (mode === 'zen') { zenSplats++; if (zenSplats % 20 === 0) zenNextPlace(); }   // zen: somewhere new every 20 splats
  const type = personType(person); round.types[type] = (round.types[type] || 0) + 1;
  unlock('first');
  person.hit = true;
  person.dir = person.x < W / 2 ? -1 : 1;              // run off the nearest side
  person.speed = 320; person.dodgeTime = 0; person.pause = 0; person.frozen = 0;   // splatted: run away!
  const got = addPoints(person.points * (person.boss ? 1 : Math.min(3, streak)));   // boss is always 10
  if (person.golden) unlock('golden');
  const words = person.golden ? ['MY GOLD!', 'NOT THE SPARKLES!'] : person.skater ? SKATER_YUCKS : person.hadUmbrella ? UMBRELLA_YUCKS : YUCKS;
  addText(person.x, person.y - size - 10, words[Math.floor(Math.random() * words.length)], '#fff');
  addText(person.x, person.y - size - 40, '+' + got, '#ffe14d');
  return true;
}

// Skunk stink clouds hang around for a few seconds. Anyone who walks in gets splatted (once per cloud).
let clouds = [], storms = [];
// Whale storms rain little poops around the spot for a few seconds (the drops don't make new storms).
function updateStorms(dt) {
  for (const s of storms) {
    s.life -= dt; s.next -= dt;
    if (s.next <= 0 && s.life > 0) {
      s.next = 0.22;
      const x = s.x + (Math.random() * 2 - 1) * 75, y = s.y + (Math.random() * 2 - 1) * 30;
      poops.push({ sx: x, sy: s.y - 110, tx: x, ty: y, t: 0, dur: 0.35, size: 24, animal: s.animal, drop: true, stormDrop: true });
    }
  }
  storms = storms.filter(s => s.life > 0);
}
function updateClouds(dt) {
  for (const c of clouds) {
    c.life -= dt;
    for (const person of people) {
      if (person.hit || c.got.has(person)) continue;
      const bodyY = person.y - 70 * person.scale * 0.45;
      if (Math.hypot(person.x - c.x, (bodyY - c.y) * 1.5) < c.r + 20 * person.scale) {
        c.got.add(person);
        strike(person, true, c.x, c.y, true);
        sfx('eww');
      }
    }
  }
  clouds = clouds.filter(c => c.life > 0);
}

try { animalXP = JSON.parse(localStorage.getItem('poopAnimalXP') || '{}'); } catch (e) {}

const levelBoost = a => 1 + 0.05 * (animalLevel(a) - 1);

// ---- Streak calendar: which days you played (the second page of stats) ----
const dayKey = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;   // same style as todayKey
function streaks() {
  const days = new Set(life.days);
  let current = 0;
  for (const d = new Date(); days.has(dayKey(d)); d.setDate(d.getDate() - 1)) current++;   // days in a row up to today
  let best = 0, run = 0;
  const sorted = [...days].map(k => { const [y, m, dd] = k.split('-').map(Number); return new Date(y, m - 1, dd); }).sort((a, b) => a - b);
  for (let i = 0; i < sorted.length; i++) {
    const gap = i ? Math.round((sorted[i] - sorted[i - 1]) / 86400000) : 1;
    run = gap === 1 ? run + 1 : 1;
    best = Math.max(best, run);
  }
  return { current, best: Math.max(best, current) };
}
function drawCalendar() {
  ctx.fillStyle = '#1b2a10'; ctx.fillRect(0, 0, W, H);
  const { current, best } = streaks();
  label('📅 Your play calendar', W / 2, 40, Math.min(30, W / 13), '#ffe14d');
  label(`🔥 Streak: ${current} day${current === 1 ? '' : 's'} in a row   ·   Best: ${best}`, W / 2, 76, Math.min(18, W / 24), '#fff', true, 'center', W - 24);
  const days = new Set(life.days), today = new Date();
  const start = new Date(today); start.setDate(today.getDate() - today.getDay() - 28);   // 5 weeks, starting on a Sunday
  const cell = Math.min(52, (W - 24) / 7, (H - 170) / 6), x0 = W / 2 - cell * 3.5, y0 = 104;
  ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach((n, i) => label(n, x0 + cell * (i + 0.5), y0 + cell * 0.3, Math.min(15, cell * 0.35), '#c5e1a5', false));
  for (let i = 0; i < 35; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const x = x0 + (i % 7) * cell, y = y0 + cell * 0.6 + Math.floor(i / 7) * cell;
    const played = days.has(dayKey(d)), isToday = dayKey(d) === dayKey(today), future = d > today;
    ctx.fillStyle = played ? 'rgba(105,240,174,0.35)' : future ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.roundRect(x + 3, y + 3, cell - 6, cell - 6, 8); ctx.fill();
    if (isToday) { ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 2; ctx.stroke(); }
    label(String(d.getDate()), x + 10, y + 13, Math.min(12, cell * 0.25), future ? '#556' : '#ddd', false, 'left');
    if (played) emoji('💩', x + cell / 2, y + cell * 0.58, cell * 0.42);
  }
  label('Tap anywhere to go back', W / 2, H - 26, Math.min(16, W / 24), '#ff7ad9');
}

function makeChallenge({ icon, name, doneName, list, period, reward, store }) {
  let h = 0; for (const ch of period) h = (h * 31 + ch.charCodeAt(0)) >>> 0;

    const s = JSON.parse(localStorage.getItem(store) || 'null');
    if (s && s.day === period) { c.progress = s.progress; c.done = s.done; }
  } catch (e) {}
  // kind = what happened; for "best" goals (points, level) the amount is the new total, not +1.
  c.event = (kind, amount) => {
    if (c.done || c.goal.id !== kind) return;
    c.progress = c.goal.best ? Math.max(c.progress, amount) : c.progress + amount;
    if (c.progress >= c.goal.need) {

  };

}

// ---- Update ----
function movePeople(dt) {
  for (const p of people) {
    if (p.flash) p.flash = Math.max(0, p.flash - dt);
    if (p.frozen > 0 && !p.hit) { p.frozen -= dt; continue; }   // stuck in an ice cube
    if (p.dodgeTime > 0) {                             // quick hop sideways
      p.x += p.dodgeDir * p.dodgeSpeed * Math.min(dt, p.dodgeTime);
      p.dodgeTime -= dt;
      if (p.dodgeTime <= 0) p.pause = 0.5;             // then stop to look back. Phew!
      p.bob += dt * 18;
    } else if (p.pause > 0) {
      p.pause -= dt;
    } else {
      p.x += p.dir * p.speed * dt * (p.moodTime > 0 ? p.moodMul : 1);   // scared people run, grossed-out people slow down
      if (p.moodTime > 0) p.moodTime -= dt;
      p.bob += dt * (p.hit ? 18 : 8);
    }
  }
  people = people.filter(p => p.x > -120 && p.x < W + 120);
}
// Sneaky people watch the poop. Once it's partway there, if it's coming at them, they dash away.
function checkDodges(dt) {
  for (const p of people) {
    if (!p.dodger || p.hit || p.frozen > 0) continue;   // frozen people can't dodge
    p.cool -= dt;
    if (p.cool > 0) continue;
    const size = 70 * p.scale, bodyY = p.y - size * 0.45;
    for (const poop of poops) {
      if (poop.t / poop.dur < 0.35) continue;          // they don't notice it right away
      if (Math.abs(p.x - poop.tx) < size * 0.4 + poop.size * 0.4 + 20 &&
          Math.abs(bodyY - poop.ty) < size * 0.55 + poop.size * 0.3) {
        // Hop away from where it will land. The hop is just far enough to escape small poops
        // (bird, dog) but not big ones (cow, elephant).
        p.dodgeDir = p.x >= poop.tx ? 1 : -1;
        p.dodgeTime = 0.2; p.dodgeSpeed = (28 * p.scale + 22) / 0.2; p.cool = 2;
        addText(p.x, p.y - size - 10, NOPES[Math.floor(Math.random() * NOPES.length)], '#9ff');
        sfx('dodge');
        break;
      }
    }
  }
}
function update(dt) {
  if (paused) return;
  if (state === 'play') trackTime(dt);                 // for the stats page
  squeeze = Math.max(0, squeeze - dt);
  chew = Math.max(0, chew - dt);
  hungryShake = Math.max(0, hungryShake - dt);
  if (toast && (toast.time -= dt) <= 0) toast = null;
  updateConfetti(dt);
  for (const t of texts) { t.life -= dt; t.y -= 40 * dt; }
  texts = texts.filter(t => t.life > 0);
  if (state === 'banner') {
    bannerTime -= dt;
    movePeople(dt);
    if (bannerTime <= 0) startLevel();
    return;
  }
  if (state !== 'play') return;

  if (tut) {
    if (tut <= 2 && ANIMALS[current].ammo === 0 && poops.length === 0) tut = 3;
    if (tut >= 4) { tutTimer -= dt; if (tutTimer <= 0) { if (tut < 6) { tut++; tutTimer = 4.5; } else finishTutorial(); } }
  } else {
    if (mode !== 'zen') timeLeft -= dt;               // zen mode has no clock
  }
  if (timeLeft <= 0) {
    timeLeft = 0; state = 'over'; drag = null; texts = []; toast = null;
    if (mode === 'duo') {                              // two players: end of a turn
      duo.scores[duo.turn - 1] = score;
      if (duo.turn === 1) { duo.turn = 2; state = 'duoReady'; sfx('level'); } else { newBest = false; sfx('level'); }
      return;
    }
    coins += score; saveShop();                        // points become coins for the shop
    life.coins += score; saveLife();
    if (mode === 'rush') {                             // boss rush keeps its own best
      newBest = rushBeaten > rushBest;
      if (newBest) { rushBest = rushBeaten; try { localStorage.setItem('poopRushBest', rushBest); } catch (e) {} }
      sfx(newBest ? 'level' : 'end');
      return;
    }
    newBest = score > best && score > 0;
    sfx(newBest ? 'level' : 'end');                     // happy tune for a new best, sad tune otherwise
    dailyEvent('points', score);
    if (score > best) { best = score; try { localStorage.setItem('poopBest', best); } catch (e) {} }
    if (level > bestLevel) { bestLevel = level; try { localStorage.setItem('poopBestLevel', bestLevel); } catch (e) {} }
    return;                                            // game over: nothing else happens this frame
  }

  spawnTimer -= dt;
  const busy = (1.6 - Math.min(1, (LEVEL_TIME - timeLeft) / LEVEL_TIME) * 0.6) / crowdBoost();
  if (mode === 'rush') {
    if (!people.some(p => p.boss && !p.hit)) spawnBoss();   // the next boss comes right away
  } else {
    if (spawnTimer <= 0) { spawnPerson(); spawnTimer = busy * (0.6 + Math.random() * 0.8); }
    if (isBossLevel() && !bossSpawned && !tut && timeLeft < LEVEL_TIME - 5) spawnBoss();
  }
  if (!tut) updatePowerups(dt);
  if (!tut && (reactTimer -= dt) <= 0) { reactTo(ANIMALS[current], 1); reactTimer = 6 + Math.random() * 4; }   // every few seconds someone notices your animal
  streakTimer = Math.max(0, streakTimer - dt);
  if (streakTimer === 0) streak = 0;

  checkDodges(dt);
  movePeople(dt);

  for (const p of poops) {
    if (p.follow && !p.follow.hit) { p.tx = p.follow.x; p.ty = p.follow.y - 70 * p.follow.scale * 0.45; }
    if (p.back && p.t > 0) {                           // a boomerang splats anyone it passes on the way back
      const k = p.t / p.dur, x = p.sx + (p.tx - p.sx) * k, y = p.sy + (p.ty - p.sy) * k - Math.sin(k * Math.PI) * 20;
      for (const person of people) {
        if (person.hit || p.got.has(person)) continue;
        const size = 70 * person.scale;
        if (Math.abs(person.x - x) < size * 0.35 + 14 && Math.abs(person.y - size * 0.45 - y) < size * 0.6) {
          p.got.add(person);
          if (strike(person, true, x, y)) sfx('eww');
        }
      }
    }
    p.t += dt;
    if (p.t >= p.dur) land(p);
  }
  poops = poops.filter(p => p.t < p.dur);
  updateClouds(dt);
  updateStorms(dt);
  if (state === 'play' && !tut && mode !== 'rush' && mode !== 'duo' && levelScore >= goal()) levelUp();
  for (const s of splats) {
    s.life -= dt;
    if (s.vx > 5) rollSplat(s, dt);                  // rolling down the mountain
  }
  splats = splats.filter(s => s.life > 0);
}

// ---- Drawing ----
// Drawing emoji is slow, so each emoji is drawn once into a little picture and reused (much faster).
const emojiCache = new Map();
function emojiPicture(ch, size) {
  const key = ch + '|' + size;
  let pic = emojiCache.get(key);
  if (!pic) {
    if (emojiCache.size > 600) {                       // don't let it grow forever: drop the 100 oldest pictures
      let n = 0;
      for (const k of emojiCache.keys()) { emojiCache.delete(k); if (++n >= 100) break; }
    }
    pic = document.createElement('canvas');
    pic.width = pic.height = Math.ceil(size * 1.4);
    const c = pic.getContext('2d');
    c.font = `${size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(ch, pic.width / 2, pic.height / 2);
    emojiCache.set(key, pic);
  }
  return pic;
}
// Sizes are rounded to steps about 12% apart, so a shrinking poop reuses a few pictures
// instead of making a new one every frame.
const STEP = Math.log(1.12);
const sizeStep = size => Math.max(4, Math.round(Math.exp(Math.round(Math.log(size) / STEP) * STEP)));
function emoji(ch, x, y, size, flip) {
  if (size < 2) return;
  const base = sizeStep(size);
  const pic = emojiPicture(ch, base);
  const w = pic.width * (size / base);
  if (flip) {
    ctx.save(); ctx.translate(x, y); ctx.scale(-1, 1);
    ctx.drawImage(pic, -w / 2, -w / 2, w, w);
    ctx.restore();
  } else {
    ctx.drawImage(pic, x - w / 2, y - w / 2, w, w);
  }
}
// maxW (optional): squeeze the text so it's never wider than this.
function label(msg, x, y, size, color, stroke = true, align = 'center', maxW = 0) {
  ctx.font = `bold ${size}px system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (maxW) {
    if (stroke) { ctx.lineWidth = 5; ctx.strokeStyle = '#3a2410'; ctx.strokeText(msg, x, y, maxW); }
    ctx.fillStyle = color; ctx.fillText(msg, x, y, maxW);
    return;
  }
  if (stroke) { ctx.lineWidth = 5; ctx.strokeStyle = '#3a2410'; ctx.strokeText(msg, x, y); }
  ctx.fillStyle = color; ctx.fillText(msg, x, y);
}
// Splits a sentence into lines that fit the screen.
function wrapLines(msg, size, maxW) {
  ctx.font = `bold ${size}px system-ui, sans-serif`;
  const lines = [''];
  for (const word of msg.split(' ')) {
    const tryLine = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + word : word;
    if (ctx.measureText(tryLine).width > maxW && lines[lines.length - 1]) lines.push(word);
    else lines[lines.length - 1] = tryLine;
  }
  return lines;
}
// Writes a sentence over several lines if it's too wide for the screen. Returns where it ended.
function para(msg, x, y, size, color, maxW) {
  const lines = wrapLines(msg, size, maxW);
  lines.forEach((l, i) => label(l, x, y + i * size * 1.3, size, color));
  return y + lines.length * size * 1.3;
}

// The bar at the top: score, timer, level goal, active power-ups and poop left.
function drawHud() {
  label(`Score: ${score}`, 16, 30, 26, '#fff', true, 'left');
  const hudX = W >= 600 ? W / 2 : W - 140;
  if (mode === 'zen') label('🧘 Zen', hudX, 30, 26, '#9ff');
  else label(`⏱ ${Math.ceil(timeLeft)}`, hudX, 30, 26, timeLeft < 10 ? '#ff6b6b' : '#fff');
  if (mode === 'zen') label(`Splats: ${zenSplats}`, hudX, 62, 18, '#9ff');
  else if (mode === 'duo') label(`👤 ${pName(duo.turn)}`, hudX, 62, 18, duo.turn === 1 ? '#40c4ff' : '#ff8a80');
  else if (mode === 'rush') label(`👑 Bosses beaten: ${rushBeaten}`, hudX, 62, 18, '#ff7ad9');
  else label(`Level ${level} · ${Math.min(levelScore, goal())}/${goal()}`, hudX, 62, 18, '#ffe14d');
  const active = [];
  if (doubleTime > 0) active.push(`⭐ x2 ${Math.ceil(doubleTime)}s`);
  if (superTime > 0) active.push(`💥 ${Math.ceil(superTime)}s`);
  if (streak >= 2) active.push(`🔥 x${Math.min(3, streak)}`);
  if (active.length) label(active.join('  '), hudX, 90, 16, '#fff');
  const a = ANIMALS[current];                                          // poop left in your animal
  for (let i = 0; i < a.maxAmmo; i++) {
    ctx.globalAlpha = i < a.ammo ? 1 : 0.2;
    emoji('💩', 28 + i * 26, 64, 22);
  }
  ctx.globalAlpha = 1;
  if (mode === 'zen' && state === 'play') {            // zen: a button to go back to the menu
    const d = zenDoneBtn();
    ctx.fillStyle = 'rgba(79,195,247,0.85)';
    ctx.beginPath(); ctx.roundRect(d.x, d.y, d.w, d.h, 10); ctx.fill();
    label('🏠 Done', d.x + d.w / 2, d.y + d.h / 2, 16, '#fff', true, 'center', d.w - 10);
  }
}

const trophyLineY = () => H - 28;
function drawShop() {
  ctx.fillStyle = '#10202a'; ctx.fillRect(0, 0, W, H);
  label('🛒 Shop', W / 2, 40, Math.min(32, W / 12), '#9ff');
  label(`You have 🪙 ${coins} coins`, W / 2, 76, Math.min(20, W / 20), '#ffe14d');
  // Two tabs: animals and hats
  shopTabs = [{ id: 'animals', text: '🐾 Animals', x: W / 2 - 85 }, { id: 'hats', text: '🎩 Hats', x: W / 2 + 85 }];
  for (const t of shopTabs) {
    const on = shopTab === t.id;
    ctx.fillStyle = on ? '#9ff' : 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.roundRect(t.x - 75, 96, 150, 34, 10); ctx.fill();
    label(t.text, t.x, 113, 17, on ? '#10202a' : '#fff', false);
  }
  shopRows = []; shopCells = [];
  const top = 142, fs0 = Math.min(20, W / 20);
  if (shopTab === 'animals') {
    const list = ANIMALS.filter(a => a.price);
    const rowH = Math.min(70, (H - top - 90) / list.length), fs = Math.min(fs0, rowH * 0.36), left = Math.max(16, W / 2 - 200);
    list.forEach((a, i) => {
      const y = top + i * rowH + rowH / 2, have = isOwned(a), afford = coins >= a.price;
      shopRows.push({ a, y, h: rowH });
      ctx.fillStyle = have ? 'rgba(105,240,174,0.15)' : 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.roundRect(left - 8, y - rowH / 2 + 4, Math.min(W - 16, 416), rowH - 8, 12); ctx.fill();
      emoji(a.emoji, left + 24, y, Math.min(44, rowH * 0.7));
      label(a.name, left + 60, y - fs * 0.45, fs, '#fff', true, 'left');
      label(a.shopText, left + 60, y + fs * 0.6, fs * 0.7, '#ccc', false, 'left', Math.min(W - 32, 400) - 175);
      label(have ? '✅ Yours!' : `🪙 ${a.price}`, left + Math.min(W - 32, 400) - 8, y, fs, have ? '#69f0ae' : afford ? '#ffe14d' : '#ff8a80', true, 'right');
    });
  } else {
    const cols = Math.max(2, Math.min(6, Math.floor((W - 24) / 100))), rows = Math.ceil(ANIMAL_HATS.length / cols);
    const cw = Math.min(110, (W - 24) / cols), ch = Math.min(96, (H - top - 90) / rows), x0 = W / 2 - (cols * cw) / 2;
    ANIMAL_HATS.forEach((h, i) => {
      const x = x0 + (i % cols) * cw, y = top + Math.floor(i / cols) * ch, have = hatsOwned.has(h.id), wearing = hatOn === h.id;
      shopCells.push({ h, x, y, w: cw, ht: ch });
      ctx.fillStyle = wearing ? 'rgba(255,225,77,0.3)' : have ? 'rgba(105,240,174,0.15)' : 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.roundRect(x + 4, y + 4, cw - 8, ch - 8, 12); ctx.fill();
      emoji(h.emoji, x + cw / 2, y + ch * 0.4, Math.min(40, ch * 0.45));
      const tag = wearing ? 'Wearing' : have ? 'Wear it' : `🪙 ${h.price}`;
      label(tag, x + cw / 2, y + ch * 0.8, Math.min(15, ch * 0.18), wearing ? '#ffe14d' : have ? '#69f0ae' : coins >= h.price ? '#fff' : '#ff8a80', true, 'center', cw - 12);
    });
  }
  if (shopMsg) para(shopMsg, W / 2, H - 60, Math.min(18, W / 22), '#ffe14d', W - 32);
  label(shopTab === 'animals' ? 'Tap an animal to buy it · tap anywhere else to go back' : 'Tap a hat to buy or wear it · tap anywhere else to go back',
    W / 2, H - 26, Math.min(15, W / 26), '#ff7ad9', true, 'center', W - 16);
}

// A full-screen list of [icon, name, line] rows; two columns on short wide screens.
function drawList(title, rows, footer, bg) {
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  label(title, W / 2, 46, Math.min(32, W / 12), '#ffe14d');
  const cols = (H - 140) / rows.length < 40 && W > 600 ? 2 : 1;
  const perCol = Math.ceil(rows.length / cols);
  const rowH = Math.min(54, (H - 140) / perCol), fs = Math.min(18, W / 24 / cols * 1.4, rowH * 0.42);
  const colW = W / cols;
  rows.forEach(([icon, name, line], i) => {
    const col = Math.floor(i / perCol), left = col * colW + Math.max(14, colW / 2 - (cols === 2 ? 170 : 230));
    const y = 96 + (i % perCol) * rowH;
    emoji(icon, left + 16, y, Math.min(30, rowH * 0.7));
    const room = colW - (left - col * colW) - 52;                 // squeeze long lines so they fit
    label(name, left + 42, y - fs * 0.45, fs, '#fff', true, 'left', room);
    label(line, left + 42, y + fs * 0.6, fs * 0.78, '#ccc', false, 'left', room);
  });
  label(footer, W / 2, H - 28, Math.min(16, W / 24), '#ff7ad9');
}

function drawTrophies() {

  // Short screens show two columns so the rows don't squash together.
  const cols = (H - 140) / ACHIEVEMENTS.length < 40 && W > 600 ? 2 : 1;
  const perCol = Math.ceil(ACHIEVEMENTS.length / cols);

  ACHIEVEMENTS.forEach((a, i) => {
    const col = Math.floor(i / perCol), left = col * colW + Math.max(16, colW / 2 - (cols === 2 ? 150 : 220));
    const y = 100 + (i % perCol) * rowH, got = unlocked.has(a.id);
    ctx.globalAlpha = got ? 1 : 0.45;
    emoji(got ? a.icon : '🔒', left + 16, y, Math.min(30, rowH * 0.7));

function drawTutorial() {
  const size = Math.min(20, Math.max(15, W / 30)), boxW = Math.min(W - 24, 560);
  const lines = wrapLines(TUT_TEXT[tut], size, boxW - 30);
  const boxH = lines.length * size * 1.3 + 34, bx = W / 2 - boxW / 2;
  const by = Math.max(88, horizon() - boxH - 6);          // up in the sky if there's room, so it doesn't cover people
  tutBox = { x: bx, y: by, w: boxW, h: boxH };
  ctx.fillStyle = 'rgba(30,15,5,0.82)';
  ctx.beginPath(); ctx.roundRect(bx, by, boxW, boxH, 14); ctx.fill();
  ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 3; ctx.stroke();
  para(TUT_TEXT[tut], W / 2, by + 14 + size * 0.6, size, '#fff', boxW - 30);
  label('tap here to skip ⏭', bx + boxW - 12, by + boxH - 11, 12, '#ffe14d', false, 'right');

  const bob = Math.sin(performance.now() / 180) * 8;
  if (tut === 1) {                                     // point at a person
    const ok = q => !q.hit && q.x > 60 && q.x < W - 60;
    const p = people.find(q => ok(q) && q.y - 70 * q.scale > by + boxH) || people.find(ok);   // someone not behind the box
    if (p) emoji('👆', p.x, p.y + 22 + bob, 34);
  } else if (tut === 3) {                              // show the food going from the bowl to the mouth
    const b = bowlPos(), a = animalPos(), k = (performance.now() / 1400) % 1;
    const x = b.x + (a.x - b.x) * k, y = b.y + (a.y - 20 - b.y) * k - Math.sin(k * Math.PI) * 60;
    ctx.globalAlpha = 0.75;
    emoji(ANIMALS[current].food, x, y, 40); emoji('👆', x + 14, y + 30, 30);
    ctx.globalAlpha = 1;
  } else if (tut === 4) {                              // point at the animal buttons
    const rects = buttonRects(), topY = rects[0].y;
    for (const r of rects) if (r.y === topY) emoji('👇', r.x + r.w / 2, r.y - 22 + bob, 24);   // just the top row
  }
}


function drawPocket() {
  const top = pocketTop();
  ctx.fillStyle = '#3b5aa0'; ctx.fillRect(0, top, W, H - top);       // your jeans
  ctx.strokeStyle = '#f2c14e'; ctx.setLineDash([10, 8]); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, top + 6); ctx.lineTo(W, top + 6); ctx.stroke(); ctx.setLineDash([]);

  // The animal in your pocket
  const a = ANIMALS[current], pos = animalPos(), u = ui();
  ctx.fillStyle = '#2c4680';
  ctx.beginPath(); ctx.ellipse(pos.x, pos.y + 25 * u, 85 * u, 45 * u, 0, 0, Math.PI * 2); ctx.fill();   // pocket hole
  const sq = squeeze > 0 ? Math.sin(squeeze / 0.25 * Math.PI) : 0;
  const chomp = chew > 0 ? Math.abs(Math.sin(chew * 25)) * 0.12 : 0;
  const shake = hungryShake > 0 ? Math.sin(hungryShake * 60) * 6 : 0;
  ctx.save(); ctx.translate(pos.x + shake, pos.y);
  ctx.scale(1 + sq * 0.35 + chomp, 1 - sq * 0.3 - chomp);
  emoji(a.emoji, 0, -10 * u, 90 * u);
  const hat = ANIMAL_HATS.find(h => h.id === hatOn);
  if (hat) emoji(hat.emoji, 0, -58 * u, 40 * u);       // your animal's hat (squishes along with it)
  ctx.restore();
  if (sq > 0) emoji('✊', pos.x + 55 * u, pos.y, 50 * u);             // your squeezing hand
  drawLevelBadge(a, pos, u);                           // Lv 1-5 badge and progress next to your animal
  if (a.ammo === 0 && state === 'play') label('HUNGRY! Feed me →', Math.max(pos.x + 40, 110), top - 18, 20, '#ffe14d');

  // Food bowl
  const b = bowlPos();
  ctx.fillStyle = '#c0392b';
  ctx.beginPath(); ctx.ellipse(b.x, b.y + 20 * u, 65 * u, 25 * u, 0, 0, Math.PI * 2); ctx.fill();
  emoji(a.food, b.x - 20 * u, b.y, 40 * u); emoji(a.food, b.x + 18 * u, b.y + 4 * u, 40 * u);
  label(a.foodName, b.x, b.y - 42 * u, 16, '#fff');

  // Animal buttons
  buttonRects().forEach((r, i) => {
    ctx.fillStyle = i === current ? '#ffe14d' : 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill();
    const locked = !isOwned(ANIMALS[i]);
    if (locked) ctx.globalAlpha = 0.35;
    emoji(ANIMALS[i].emoji, r.x + r.w / 2, r.y + r.h / 2, r.w * 0.62);
    ctx.globalAlpha = 1;
    if (locked) emoji('🔒', r.x + r.w - 10, r.y + r.h - 10, r.w * 0.32);
    label(['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '='][i] || '', r.x + 9, r.y + 10, 12, '#fff', false);   // the key for each animal
  });
}

function drawPoopFlying(p) {
  if (p.drop && p.lead) {                              // the bat swoops across the top while its poops fall
    const kb = Math.max(0, Math.min(1, (p.t + 0.3) / (p.dur + 0.6)));
    emoji('🦇', p.tx - 140 + 280 * kb, Math.max(40, horizon() * 0.45), 44);
  }
  if (p.t < 0) return;                                 // not dropped yet
  const k = p.t / p.dur;
  const x = p.sx + (p.tx - p.sx) * k + (p.sink ? Math.sin(k * 14) * 10 : 0);   // sinking poops wobble
  const arc = p.drop ? 0 : p.back ? 20 : p.bounced || p.mini ? 45 : p.floaty ? 230 : p.sink ? 50 : 120;     // bat poop falls straight down, a bounce is a small hop
  const y = p.sy + (p.ty - p.sy) * k - Math.sin(k * Math.PI) * arc;
  const size = (p.size * 0.9) * (1 - k * 0.45);
  if (ANIMALS[p.animal].homing) emoji('✨', x - (p.tx - p.sx) * 0.06, y + 14, size * 0.8);   // magic sparkles
  if (p.chained) emoji('🔥', x - 8, y + 10, size * 0.8);                       // dragon fire trail
  emoji('💩', x, y, size);
}

function draw() {
  drawPlace();
  for (const s of splats) {
    ctx.globalAlpha = Math.min(1, s.life);
    ctx.fillStyle = s.magic ? '#ff7ad9' : s.ice ? '#90caf9' : '#6b3e13';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, s.size * 0.6, s.size * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    emoji('💩', s.x, s.y - s.size * 0.15, s.size * 0.6);
    ctx.globalAlpha = 1;
  }
  for (const p of people) {
    const size = 70 * p.scale;
    const bob = Math.abs(Math.sin(p.bob)) * (place().lowGravity ? 14 : 4) * p.scale;   // bouncy on the moon
    if (p.flash && Math.floor(p.flash * 20) % 2) ctx.globalAlpha = 0.4;    // the boss blinks when hit
    if (p.golden && !p.hit) {                          // golden people shine and sparkle
      ctx.fillStyle = 'rgba(255,215,64,0.35)'; ctx.beginPath(); ctx.arc(p.x, p.y - size * 0.45 - bob, size * 0.6, 0, Math.PI * 2); ctx.fill();
      ctx.filter = 'sepia(1) saturate(5) brightness(1.15)';
    }
    emoji(p.emoji, p.x, p.y - size * 0.45 - bob, size, p.dir === 1);   // emoji face left, so flip
    ctx.filter = 'none';
    if (p.golden && !p.hit) { const t = performance.now() / 300; emoji('✨', p.x + Math.cos(t) * size * 0.5, p.y - size * 0.6 - bob + Math.sin(t) * size * 0.3, size * 0.3); }
    ctx.globalAlpha = 1;
    if (p.boss) {
      const head = p.y - size * 0.95 - bob;
      for (let i = 0; i < 3 - p.hp; i++) emoji('💩', p.x, head - i * size * 0.14, size * 0.26);   // poop pile on his head
      if (!p.hit) {
        emoji(p.crown || '👑', p.x, head - (3 - p.hp) * size * 0.14 - size * 0.08, size * 0.3);
        for (let i = 0; i < p.hp; i++) emoji('❤️', p.x + (i - (p.hp - 1) / 2) * 20, head - size * 0.3 - (3 - p.hp) * size * 0.14, 18);
      }
      continue;
    }
    if (p.prop) emoji(p.prop, p.x + p.dir * size * 0.28, p.y - size * 0.35 - bob, size * 0.38);   // what they carry
    if (p.umbrella) emoji('☂️', p.x, p.y - size * 1.05 - bob, size * 0.7);
    if (place().helmets && !p.boss) {                  // space helmets on the moon
      ctx.fillStyle = 'rgba(200,230,255,0.25)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y - size * 0.84 - bob, size * 0.19, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    if (p.skater) emoji('🛹', p.x, p.y + size * 0.04, size * 0.65, p.dir === 1);
    if (p.frozen > 0 && !p.hit) { ctx.globalAlpha = 0.55; emoji('🧊', p.x, p.y - size * 0.45, size * 0.95); ctx.globalAlpha = 1; }
    if (party && !p.umbrella) emoji(p.hat, p.x, p.y - size * 1.0 - bob, size * 0.42);   // party hats!
    if (p.hit) emoji('💩', p.x, p.y - size * 0.95 - bob, size * 0.45);   // poop on their head!
  }
  for (const pu of powerups) {
    if (pu.life < 2 && Math.floor(pu.life * 6) % 2) continue;          // blinks before it goes away
    const landed = pu.y >= pu.landY, bob = landed ? Math.sin(performance.now() / 200) * 4 : 0;
    if (!landed) emoji('🪂', pu.x, pu.y - 34, 30);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(pu.x, pu.y + bob, 26, 0, Math.PI * 2); ctx.fill();
    emoji(POWERS[pu.kind].emoji, pu.x, pu.y + bob, 36);
    if (landed) label('tap!', pu.x, pu.y + 38, 14, '#fff');
  }
  for (const s of storms) {                            // whale storm clouds
    ctx.globalAlpha = Math.min(1, s.life * 2);
    emoji('⛈️', s.x, s.y - 130, 56);
    ctx.globalAlpha = 1;
  }
  for (const c of clouds) {                            // green stink clouds
    ctx.globalAlpha = Math.min(0.55, c.life * 0.5);
    ctx.fillStyle = '#8bc34a';
    const wob = Math.sin(performance.now() / 250 + c.x) * 5;
    ctx.beginPath(); ctx.ellipse(c.x, c.y, c.r + wob, (c.r + wob) * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = Math.min(1, c.life);
    emoji('💨', c.x - 25, c.y - 15 + wob, 30); emoji('💨', c.x + 25, c.y + 5 - wob, 26, true);
    ctx.globalAlpha = 1;
  }
  for (const p of poops) drawPoopFlying(p);
  drawConfetti();
  drawPocket();
  if (drag) emoji(ANIMALS[current].food, drag.x, drag.y, 48);
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life * 2); label(t.msg, t.x, t.y, 22, t.color); ctx.globalAlpha = 1; }

  if (state === 'play' || state === 'banner') drawHud();   // no score bar on the start or end screen

  if (state === 'play' && tut) drawTutorial();
  if (state === 'duoReady') drawDuoReady();
  if (state === 'banner') {
    ctx.fillStyle = 'rgba(40,20,5,0.35)'; ctx.fillRect(0, 0, W, H);
    const pop = Math.min(1, (2.2 - bannerTime) * 5);                   // grows in quickly
    const bs = Math.min(70, W / 7) * (0.5 + pop * 0.5);
    const by = Math.max(H * 0.32, 85 + Math.min(70, W / 7) / 2);    // stay below the score bar
    const step = Math.min(22, W / 20) * 1.5, line1 = by + Math.min(70, W / 7) * 0.85;
    label(`Level ${level}!`, W / 2, by, bs, '#ffe14d');
    label(`${place().icon} ${place().name} ${place().icon}`, W / 2, line1, Math.min(28, W / 15), '#9ff');
    label(isBossLevel() ? `⚠️ ${bossLook()[1]} is coming!` : 'Faster people, and more of them!', W / 2, line1 + step * 1.1, Math.min(22, W / 20), '#fff');
    label(`Goal: ${goal()} points`, W / 2, line1 + step * 2.1, Math.min(22, W / 20), '#fff');
  }
  if (state === 'title' || state === 'over') {
    ctx.fillStyle = 'rgba(40,20,5,0.7)'; ctx.fillRect(0, 0, W, H);
    const s = Math.min(54, W / 11);
    if (state === 'title') {
      const ts = Math.max(15, Math.min(20, W / 28)), maxW = Math.min(W - 32, 700);
      const short = H < 520;                           // short screens (like a sideways phone) get fewer words
      const ss = short ? Math.min(s, H / 9) : s;
      const btnBottom = Math.max(...modeButtons().map(b => b.y + b.h));
      let y = Math.max(short ? H * 0.14 : H * 0.22, btnBottom + 10 + ss * 0.5);   // stay below the mode buttons
      label('💩 POOP POCKET 💩', W / 2, y, ss, '#ffe14d');
      if (SEASON_TEXT[season]) label(SEASON_TEXT[season], W / 2, y + ss * 0.62, Math.min(16, W / 26), '#fff', true, 'center', W - 24);
      y += ss * 1.3;
      if (short) {
        y = para('Click the park to shoot poop at people. Out of poop? Drag the food to your animal\'s mouth.', W / 2, y, ts, '#fff', maxW) + ts * 0.5;
      } else {
        y = para('Click the park to SQUEEZE your animal and shoot poop at people.', W / 2, y, ts, '#fff', maxW) + ts * 0.5;
        y = para('Out of poop? Drag the food from the bowl into its mouth to feed it.', W / 2, y, ts, '#fff', maxW) + ts * 0.5;
        y = para('Switch animals with 1-9, 0 or the buttons. Runners 🏃 are worth 3. Sneaky people dodge, but big poops are hard to escape!', W / 2, y, ts, '#fff', maxW) + ts * 0.5;
      }
      y = para('Reach the goal before time runs out to get to the next level!', W / 2, y, ts, '#ffe14d', maxW);
      if (short) y -= Math.min(32, W / 16) * 0.5;
      label('Click to start', W / 2, Math.min(y + Math.min(32, W / 16) * 1.5, trophyLineY() - 110), Math.min(32, W / 16), '#ff7ad9');
      if (best > 0) label(`Your best: ${best} points · Level ${bestLevel}`, W / 2, Math.min(y + Math.min(32, W / 16) * 3, trophyLineY() - 80), Math.min(18, W / 22), '#fff');
    } else {
      const short = H < 520;                           // squeeze things together on short screens
      const ts = short ? Math.min(20, W / 22) : Math.min(26, W / 18), ss = short ? Math.min(s, H / 8) : s;
      let y = short ? H * 0.2 : H * 0.28;
      const rush = mode === 'rush', two = mode === 'duo' && duo;
      const [s1, s2] = two ? duo.scores : [0, 0];
      const winner = two ? (s1 > s2 ? `${pName(1).toUpperCase()} WINS! 🏆` : s2 > s1 ? `${pName(2).toUpperCase()} WINS! 🏆` : "IT'S A TIE! 🤝") : '';
      label(two ? winner : rush ? 'BOSS RUSH OVER!' : "TIME'S UP!", W / 2, y, ss, '#ffe14d', true, 'center', W - 24);
      const said = two ? `👤 ${pName(1)}: ${s1} points   ·   👤 ${pName(2)}: ${s2} points`
        : rush ? `You beat ${rushBeaten} giant boss${rushBeaten === 1 ? '' : 'es'}! (+${score} 🪙)`
        : `You made it to Level ${level} and pooped on people for ${score} points (+${score} 🪙)`;
      y = para(said, W / 2, y + ss * 1.2, ts, '#fff', W - 32);
      if (two) {
        label('Want a rematch?', W / 2, y + ts * 0.4, ts, '#fff');
      } else if (newBest) {
        const pulse = 1 + Math.sin(performance.now() / 150) * 0.06;
        label('🎉 NEW BEST! 🎉', W / 2, y + ts * 0.4, ts * 1.2 * pulse, '#ffe14d');
      } else {
        label(rush ? `Best boss rush: ${rushBest} bosses` : `Best: ${best} points · Level ${bestLevel}`, W / 2, y + ts * 0.4, ts, '#fff');
      }
      y = para(recapText(), W / 2, y + ts * 1.5, Math.min(16, W / 26), '#9ff', W - 24);   // what happened this round
      label('Click to play again', W / 2, Math.min(y + ts * 1.4, trophyLineY() - 82), Math.min(32, W / 16), '#ff7ad9');
    }
    drawModeButtons();                                  // 👑 Boss Rush and 🧘 Zen, top left
    const fs = Math.min(18, W / 22);
    const cs = Math.min(15, W / 26);                   // today's and this week's challenge, one line each
    label(daily.text(), W / 2, trophyLineY() - 54, cs, daily.done ? '#69f0ae' : '#fff', true, 'center', W - 20);
    label(weekly.text(), W / 2, trophyLineY() - 32, cs, weekly.done ? '#69f0ae' : '#ffe14d', true, 'center', W - 20);
    const narrow = W < 600;                            // phones: shorter labels so all four fit
    label(narrow ? '🛒 Shop' : `🛒 Shop · 🪙 ${coins}`, W / 8, trophyLineY(), fs, '#9ff', true, 'center', W / 4 - 6);
    label('❓ Help', W * 3 / 8, trophyLineY(), fs, '#fff', true, 'center', W / 4 - 6);
    label('📊 Stats', W * 5 / 8, trophyLineY(), fs, '#c5e1a5', true, 'center', W / 4 - 6);
    label(`🏆 ${unlocked.size}/${ACHIEVEMENTS.length}`, W * 7 / 8, trophyLineY(), fs, '#ffe14d', true, 'center', W / 4 - 6);
    if (helpPage) drawHelp();
    if (showStats === 1) drawStats(); else if (showStats === 2) drawCalendar();
    if (showNews && state === 'title') drawList("✨ What's new!", NEWS, 'Tap anywhere to close', '#1a1030');
    if (showTrophies) drawTrophies();
    if (showShop) drawShop();
  }
  if (toast && state !== 'title') {                    // achievement pop-up
    ctx.globalAlpha = Math.min(1, toast.time * 2);
    const tw = Math.min(W - 24, 420), ty = 108;
    ctx.fillStyle = 'rgba(30,15,5,0.85)';
    ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, ty, tw, 40, 12); ctx.fill();
    ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 2; ctx.stroke();
    label(toast.msg, W / 2, ty + 20, Math.min(18, W / 22), '#ffe14d', false);
    ctx.globalAlpha = 1;
  }
  if (photoing) {                                      // taking a photo: no pause screen or buttons, just a little label
    label('💩 Poop Pocket', W - 12, H - 16, 16, '#fff', true, 'right');
    return;
  }
  if (paused) {
    ctx.fillStyle = 'rgba(40,20,5,0.6)'; ctx.fillRect(0, 0, W, H);
    label('⏸️ Paused', W / 2, H * 0.38, Math.min(54, W / 8), '#ffe14d');
    para('Click anywhere or press P to keep going', W / 2, H * 0.38 + 60, Math.min(22, W / 20), '#fff', W - 32);
    const pb = photoBtn();
    ctx.fillStyle = 'rgba(255,167,38,0.95)'; ctx.beginPath(); ctx.roundRect(pb.x, pb.y, pb.w, pb.h, 12); ctx.fill();
    label('📸 Save photo (C)', pb.x + pb.w / 2, pb.y + pb.h / 2, 18, '#fff', true, 'center', pb.w - 12);
    if (performance.now() < photoMsgUntil) label('Photo saved to your Downloads! 📸', W / 2, pb.y + pb.h + 24, Math.min(18, W / 22), '#69f0ae', true, 'center', W - 24);
  } else if (canPause()) {
    emoji('⏸️', pauseBtn().x, pauseBtn().y, 26);
  }
  emoji(['🔇', '🔉', '🔊'][volume], muteBtn().x, muteBtn().y, 30);           // drawn last so it shows on every screen
  if (!menuOpen()) { ctx.globalAlpha = party ? 1 : 0.4; emoji('🎉', partyBtn().x, partyBtn().y, 28); ctx.globalAlpha = 1; }   // hidden behind menus
}

// ---- Photo mode: pause, then save a picture of the game to your Downloads folder ----
let photoing = false, photoMsgUntil = 0;
const photoBtn = () => ({ x: W / 2 - 110, y: H * 0.38 + 100, w: 220, h: 44 });
function takePhoto() {
  photoing = true;
  draw();                                              // draw the game once without the pause screen
  photoing = false;
  canvas.toBlob(blob => {
    if (!blob) return;
    const a = document.createElement('a');             // a download link: the browser saves it, nothing opens
    a.href = URL.createObjectURL(blob);
    a.download = `poop-pocket-${new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-')}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
  photoMsgUntil = performance.now() + 2500;
  sfx('magic');
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
