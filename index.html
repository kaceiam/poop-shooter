<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poop Pocket</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd16a; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ===== Poop Pocket =====
// Click the park to SQUEEZE your animal and shoot poop.
// When it's empty, drag its food from the bowl to its mouth to feed it.
// Keys 1-4 (or tap the buttons) switch animals.

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---- The animals. Change these numbers to make them stronger or weaker! ----
const ANIMALS = [
  { name: 'Bird',     emoji: '🐦', food: '🌾', foodName: 'seeds',   maxAmmo: 6, perFood: 3, splat: 30, speed: 1.6 },
  { name: 'Dog',      emoji: '🐶', food: '🦴', foodName: 'bones',   maxAmmo: 4, perFood: 2, splat: 45, speed: 1.2 },
  { name: 'Cow',      emoji: '🐮', food: '🌿', foodName: 'grass',   maxAmmo: 3, perFood: 1, splat: 65, speed: 0.9 },
  { name: 'Elephant', emoji: '🐘', food: '🥜', foodName: 'peanuts', maxAmmo: 2, perFood: 1, splat: 95, speed: 0.7 },
];
ANIMALS.forEach(a => a.ammo = a.maxAmmo);

const PEOPLE = ['🚶', '🚶‍♀️', '🏃', '🧍', '🕺', '👮', '🧑‍🍳', '🤵'];
const YUCKS = ['EWW!', 'GROSS!', 'NOOO!', 'MY SHIRT!', 'YUCK!', 'WHY?!', 'EW EW EW'];
const ROUND_TIME = 60;

let current = 0;
let people = [], poops = [], splats = [], texts = [];
let score = 0, timeLeft = ROUND_TIME, state = 'title';
let squeeze = 0, chew = 0, hungryShake = 0;
let drag = null;            // the food you're carrying
let spawnTimer = 0;
let best = 0;
try { best = +localStorage.getItem('poopBest') || 0; } catch (e) {}

// ---- Layout helpers ----
const horizon = () => H * 0.28;
const pocketTop = () => H * 0.74;
const animalPos = () => ({ x: Math.min(W * 0.2, 170), y: H - Math.min(H * 0.13, 95) });
const bowlPos = () => ({ x: W - Math.min(W * 0.18, 150), y: H - Math.min(H * 0.11, 80) });
const btnSize = () => Math.min(56, W / 9);
function buttonRects() {
  const s = btnSize(), gap = 8, total = ANIMALS.length * s + (ANIMALS.length - 1) * gap;
  const x0 = W / 2 - total / 2, y = pocketTop() + 14;
  return ANIMALS.map((a, i) => ({ x: x0 + i * (s + gap), y, w: s, h: s }));
}

// ---- People ----
function spawnPerson() {
  const depth = Math.random();                       // 0 = far away, 1 = close
  const y = horizon() + 30 + depth * (pocketTop() - horizon() - 70);
  const scale = 0.55 + depth * 0.8;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const emoji = PEOPLE[Math.floor(Math.random() * PEOPLE.length)];
  const runner = emoji === '🏃';
  people.push({
    x: dir === 1 ? -60 : W + 60, y, scale, dir, emoji,
    speed: (runner ? 140 : 60 + Math.random() * 50) * (0.6 + scale * 0.5),
    points: runner ? 3 : 1, hit: false, bob: Math.random() * 6,
  });
  people.sort((a, b) => a.y - b.y);                  // far people drawn first
}

// ---- Shooting (the squeeze!) ----
function shoot(tx, ty) {
  const a = ANIMALS[current];
  if (a.ammo <= 0) { hungryShake = 0.4; addText(animalPos().x, animalPos().y - 70, `Feed me ${a.foodName}!`, '#fff'); return; }
  a.ammo--;
  squeeze = 0.25;
  const start = animalPos();
  const dist = Math.hypot(tx - start.x, ty - start.y);
  poops.push({ sx: start.x, sy: start.y - 30, tx, ty, t: 0, dur: (0.35 + dist / 1400) / a.speed, size: a.splat, animal: current });
}

function land(p) {
  splats.push({ x: p.tx, y: p.ty, size: p.size, life: 4 });
  let hits = 0;
  for (const person of people) {
    if (person.hit) continue;
    const size = 70 * person.scale;
    const bodyY = person.y - size * 0.45;
    if (Math.abs(person.x - p.tx) < size * 0.4 + p.size * 0.4 &&
        Math.abs(bodyY - p.ty) < size * 0.55 + p.size * 0.3) {
      person.hit = true;
      person.dir = person.x < W / 2 ? -1 : 1;        // run off the nearest side
      person.speed = 320;
      hits++;
      score += person.points;
      addText(person.x, person.y - size - 10, YUCKS[Math.floor(Math.random() * YUCKS.length)], '#fff');
      addText(person.x, person.y - size - 40, '+' + person.points, '#ffe14d');
    }
  }
  if (hits >= 2) { score += hits; addText(p.tx, p.ty - 80, `COMBO x${hits}!`, '#ff7ad9'); }
}

// ---- Feeding (the reload!) ----
function feed() {
  const a = ANIMALS[current];
  if (a.ammo >= a.maxAmmo) { addText(animalPos().x, animalPos().y - 70, "I'm full!", '#fff'); return; }
  a.ammo = Math.min(a.maxAmmo, a.ammo + a.perFood);
  chew = 0.6;
  addText(animalPos().x, animalPos().y - 70, 'nom nom!', '#fff');
}

function addText(x, y, msg, color) { texts.push({ x, y, msg, color, life: 1.2 }); }

// ---- Input ----
function pointer(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
canvas.addEventListener('pointerdown', e => {
  const p = pointer(e);
  if (state !== 'play') { startGame(); return; }
  const rects = buttonRects();
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    if (p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h) { current = i; return; }
  }
  const b = bowlPos();
  if (Math.hypot(p.x - b.x, p.y - b.y) < 70) { drag = { x: p.x, y: p.y }; return; }
  if (p.y < pocketTop()) shoot(p.x, p.y);
});
canvas.addEventListener('pointermove', e => { if (drag) { const p = pointer(e); drag.x = p.x; drag.y = p.y; } });
canvas.addEventListener('pointerup', () => {
  if (!drag) return;
  const a = animalPos();
  if (Math.hypot(drag.x - a.x, drag.y - (a.y - 20)) < 80) feed();
  drag = null;
});
addEventListener('keydown', e => {
  const n = parseInt(e.key);
  if (n >= 1 && n <= ANIMALS.length) current = n - 1;
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') startGame();
});

function startGame() {
  state = 'play'; score = 0; timeLeft = ROUND_TIME;
  people = []; poops = []; splats = []; texts = [];
  ANIMALS.forEach(a => a.ammo = a.maxAmmo);
  for (let i = 0; i < 3; i++) { spawnPerson(); people[people.length - 1].x = Math.random() * W; }
}

// ---- Update ----
function update(dt) {
  squeeze = Math.max(0, squeeze - dt);
  chew = Math.max(0, chew - dt);
  hungryShake = Math.max(0, hungryShake - dt);
  for (const t of texts) { t.life -= dt; t.y -= 40 * dt; }
  texts = texts.filter(t => t.life > 0);
  if (state !== 'play') return;

  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0; state = 'over'; drag = null;
    if (score > best) { best = score; try { localStorage.setItem('poopBest', best); } catch (e) {} }
  }

  spawnTimer -= dt;
  const busy = 1.6 - Math.min(1, (ROUND_TIME - timeLeft) / ROUND_TIME) * 0.8;  // more people later
  if (spawnTimer <= 0) { spawnPerson(); spawnTimer = busy * (0.6 + Math.random() * 0.8); }

  for (const p of people) { p.x += p.dir * p.speed * dt; p.bob += dt * (p.hit ? 18 : 8); }
  people = people.filter(p => p.x > -120 && p.x < W + 120);

  for (const p of poops) { p.t += dt; if (p.t >= p.dur) land(p); }
  poops = poops.filter(p => p.t < p.dur);
  for (const s of splats) s.life -= dt;
  splats = splats.filter(s => s.life > 0);
}

// ---- Drawing ----
function emoji(ch, x, y, size, flip) {
  ctx.save(); ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.font = `${size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch, 0, 0); ctx.restore();
}
function label(msg, x, y, size, color, stroke = true) {
  ctx.font = `bold ${size}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = 5; ctx.strokeStyle = '#3a2410'; ctx.strokeText(msg, x, y); }
  ctx.fillStyle = color; ctx.fillText(msg, x, y);
}

function drawPark() {
  const sky = ctx.createLinearGradient(0, 0, 0, horizon());
  sky.addColorStop(0, '#6ec6ff'); sky.addColorStop(1, '#bfe8ff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, horizon());
  emoji('☀️', W - 70, 55, 60);
  emoji('☁️', W * 0.25, 50, 50); emoji('☁️', W * 0.6, 80, 40);
  ctx.fillStyle = '#7cc95a'; ctx.fillRect(0, horizon(), W, H);
  for (let i = 0; i < 7; i++) emoji('🌳', (i + 0.5) * W / 7, horizon() - 10, 55);
  ctx.fillStyle = '#d9c08a';                          // a path through the park
  ctx.fillRect(0, horizon() + (pocketTop() - horizon()) * 0.45, W, 26);
}

function drawPocket() {
  const top = pocketTop();
  ctx.fillStyle = '#3b5aa0'; ctx.fillRect(0, top, W, H - top);       // your jeans
  ctx.strokeStyle = '#f2c14e'; ctx.setLineDash([10, 8]); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, top + 6); ctx.lineTo(W, top + 6); ctx.stroke(); ctx.setLineDash([]);

  // The animal in your pocket
  const a = ANIMALS[current], pos = animalPos();
  ctx.fillStyle = '#2c4680';
  ctx.beginPath(); ctx.ellipse(pos.x, pos.y + 25, 85, 45, 0, 0, Math.PI * 2); ctx.fill();   // pocket hole
  const sq = squeeze > 0 ? Math.sin(squeeze / 0.25 * Math.PI) : 0;
  const chomp = chew > 0 ? Math.abs(Math.sin(chew * 25)) * 0.12 : 0;
  const shake = hungryShake > 0 ? Math.sin(hungryShake * 60) * 6 : 0;
  ctx.save(); ctx.translate(pos.x + shake, pos.y);
  ctx.scale(1 + sq * 0.35 + chomp, 1 - sq * 0.3 - chomp);
  emoji(a.emoji, 0, -10, 90);
  ctx.restore();
  if (sq > 0) emoji('✊', pos.x + 55, pos.y, 50);                     // your squeezing hand

  // Ammo
  for (let i = 0; i < a.maxAmmo; i++) {
    ctx.globalAlpha = i < a.ammo ? 1 : 0.2;
    emoji('💩', pos.x - 60 + i * 26, pos.y - 85, 22);
  }
  ctx.globalAlpha = 1;
  if (a.ammo === 0 && state === 'play') label('HUNGRY! Feed me →', pos.x + 40, top - 18, 20, '#ffe14d');

  // Food bowl
  const b = bowlPos();
  ctx.fillStyle = '#c0392b';
  ctx.beginPath(); ctx.ellipse(b.x, b.y + 20, 65, 25, 0, 0, Math.PI * 2); ctx.fill();
  emoji(a.food, b.x - 20, b.y, 40); emoji(a.food, b.x + 18, b.y + 4, 40);
  label(a.foodName, b.x, b.y - 42, 16, '#fff');

  // Animal buttons
  buttonRects().forEach((r, i) => {
    ctx.fillStyle = i === current ? '#ffe14d' : 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill();
    emoji(ANIMALS[i].emoji, r.x + r.w / 2, r.y + r.h / 2, r.w * 0.62);
    label(String(i + 1), r.x + 9, r.y + 10, 12, '#fff', false);
  });
}

function drawPoopFlying(p) {
  const k = p.t / p.dur;
  const x = p.sx + (p.tx - p.sx) * k;
  const y = p.sy + (p.ty - p.sy) * k - Math.sin(k * Math.PI) * 120;
  const size = (p.size * 0.9) * (1 - k * 0.45);
  emoji('💩', x, y, size);
}

function draw() {
  drawPark();
  for (const s of splats) {
    ctx.globalAlpha = Math.min(1, s.life);
    ctx.fillStyle = '#6b3e13';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, s.size * 0.6, s.size * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    emoji('💩', s.x, s.y - s.size * 0.15, s.size * 0.6);
    ctx.globalAlpha = 1;
  }
  for (const p of people) {
    const size = 70 * p.scale;
    const bob = Math.abs(Math.sin(p.bob)) * 4 * p.scale;
    emoji(p.emoji, p.x, p.y - size * 0.45 - bob, size, p.dir === 1);   // emoji face left, so flip
    if (p.hit) emoji('💩', p.x, p.y - size * 0.95 - bob, size * 0.45);   // poop on their head!
  }
  for (const p of poops) drawPoopFlying(p);
  drawPocket();
  if (drag) emoji(ANIMALS[current].food, drag.x, drag.y, 48);
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life * 2); label(t.msg, t.x, t.y, 22, t.color); ctx.globalAlpha = 1; }

  label(`Score: ${score}`, 90, 30, 26, '#fff');
  label(`⏱ ${Math.ceil(timeLeft)}`, W / 2, 30, 26, timeLeft < 10 ? '#ff6b6b' : '#fff');

  if (state !== 'play') {
    ctx.fillStyle = 'rgba(40,20,5,0.7)'; ctx.fillRect(0, 0, W, H);
    const s = Math.min(54, W / 11);
    if (state === 'title') {
      label('💩 POOP POCKET 💩', W / 2, H * 0.28, s, '#ffe14d');
      label('Click the park to SQUEEZE your animal and shoot poop at people', W / 2, H * 0.42, Math.min(20, W / 28), '#fff');
      label('Out of poop? Drag the food from the bowl into its mouth to feed it', W / 2, H * 0.49, Math.min(20, W / 28), '#fff');
      label('Press 1-4 to switch animals. Runners 🏃 are worth 3!', W / 2, H * 0.56, Math.min(20, W / 28), '#fff');
      label('Click to start', W / 2, H * 0.7, Math.min(32, W / 16), '#ff7ad9');
    } else {
      label("TIME'S UP!", W / 2, H * 0.3, s, '#ffe14d');
      label(`You pooped on people for ${score} points`, W / 2, H * 0.43, Math.min(26, W / 22), '#fff');
      label(`Best: ${best}`, W / 2, H * 0.52, Math.min(26, W / 22), '#fff');
      label('Click to play again', W / 2, H * 0.68, Math.min(32, W / 16), '#ff7ad9');
    }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
